<script>


// =====================================================
// MAPA
// =====================================================

const map =

L.map("map")
.setView(
[-9.19,-75.015],
5
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:
"&copy; OpenStreetMap contributors"

}

).addTo(map);


L.control.scale()
.addTo(map);


// =====================================================
// ÁREA PERÚ
// =====================================================

const PERU_BBOX = {

west:-81.5,

south:-18.5,

east:-68.5,

north:0.5

};


// =====================================================
// POLÍGONO SIMPLIFICADO PERÚ
// =====================================================

const PERU_POLYGON = [

[-18.35,-70.37],

[-17.55,-69.45],

[-16.40,-69.00],

[-15.10,-69.40],

[-13.70,-68.90],

[-12.50,-68.75],

[-11.00,-69.00],

[-9.50,-70.00],

[-8.30,-70.50],

[-7.20,-72.00],

[-6.00,-73.50],

[-4.50,-74.00],

[-3.50,-75.00],

[-2.50,-76.00],

[-1.50,-77.00],

[-0.10,-78.00],

[-0.05,-79.50],

[-1.50,-80.80],

[-3.50,-80.90],

[-5.00,-80.70],

[-6.00,-80.90],

[-8.00,-80.70],

[-10.00,-79.80],

[-12.00,-77.50],

[-14.00,-76.00],

[-15.50,-75.50],

[-17.00,-74.00],

[-18.35,-70.37]

];


L.polygon(

PERU_POLYGON,

{

color:"#facc15",

weight:2,

fillColor:"#facc15",

fillOpacity:.04

}

).addTo(map);


// =====================================================
// VARIABLES
// =====================================================

let currentKey = "";

let fireLayers = [];

let orbitLayers = [];

let clusterLayers = [];

let puntosDetectados = [];

let actualizando = false;

let proximaActualizacion = null;

const INTERVALO = 15 * 60 * 1000;


// =====================================================
// SATÉLITES
// =====================================================

const SATELLITES = [

{

name:"NOAA-20",

source:"VIIRS_NOAA20_NRT",

norad:"43013",

color:"#38bdf8"

},

{

name:"NOAA-21",

source:"VIIRS_NOAA21_NRT",

norad:"54234",

color:"#c084fc"

},

{

name:"Suomi-NPP",

source:"VIIRS_SNPP_NRT",

norad:"37849",

color:"#4ade80"

}

];


// =====================================================
// PUNTO DENTRO DE PERÚ
// =====================================================

function puntoDentroPeru(lat,lon) {

let dentro = false;


for(

let i=0,
j=PERU_POLYGON.length-1;

i<PERU_POLYGON.length;

j=i++

) {

const lati =
PERU_POLYGON[i][0];

const loni =
PERU_POLYGON[i][1];

const latj =
PERU_POLYGON[j][0];

const lonj =
PERU_POLYGON[j][1];


const intersect =

((loni > lon) !==
(lonj > lon))

&&

(

lat <

(latj-lati) *
(lon-loni) /
(lonj-loni)
+
lati

);


if(intersect) {

dentro = !dentro;

}

}


return dentro;

}


// =====================================================
// DISTANCIA HAVERSINE
// =====================================================

function distanciaMetros(

lat1,
lon1,
lat2,
lon2

) {


const R = 6371000;

const rad =
Math.PI / 180;


const dLat =
(lat2-lat1)*rad;

const dLon =
(lon2-lon1)*rad;


const a =

Math.sin(dLat/2) ** 2

+

Math.cos(lat1*rad)

*

Math.cos(lat2*rad)

*

Math.sin(dLon/2) ** 2;


const c =

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}


// =====================================================
// DETECTAR CLÚSTERES
//
// Regla:
//
// >= 3 puntos
// conectados por <= 1000 m
//
// =====================================================

function detectarClusters(

puntos,

distanciaMax=1000,

minimoPuntos=3

) {


const visitado =
new Set();


const clusters = [];


for(

let i=0;

i<puntos.length;

i++

) {


if(
visitado.has(i)
) {

continue;

}


const cluster = [];

const cola = [i];


visitado.add(i);


while(
cola.length > 0
) {


const actual =
cola.shift();


cluster.push(actual);


for(

let j=0;

j<puntos.length;

j++

) {


if(
visitado.has(j)
) {

continue;

}


const distancia =

distanciaMetros(

puntos[actual].lat,

puntos[actual].lon,

puntos[j].lat,

puntos[j].lon

);


if(
distancia <=
distanciaMax
) {


visitado.add(j);

cola.push(j);

}

}

}

}


if(
cluster.length >=
minimoPuntos
) {

clusters.push(
cluster
);

}

}


return clusters;

}


// =====================================================
// CENTRO DEL CLÚSTER
// =====================================================

function centroCluster(
indices
) {


let lat = 0;

let lon = 0;


indices.forEach(
i => {

lat +=
puntosDetectados[i].lat;

lon +=
puntosDetectados[i].lon;

});


return {

lat:
lat / indices.length,

lon:
lon / indices.length

};

}


// =====================================================
// DIÁMETRO DEL CLÚSTER
// =====================================================

function diametroCluster(
indices
) {


let maximo = 0;


for(
let i=0;

i<indices.length;

i++

) {


for(
let j=i+1;

j<indices.length;

j++

) {


const a =
puntosDetectados[
indices[i]
];

const b =
puntosDetectados[
indices[j]
];


const distancia =

distanciaMetros(

a.lat,
a.lon,

b.lat,
b.lon

);


if(
distancia > maximo
) {

maximo =
distancia;

}

}

}


return maximo;

}


// =====================================================
// ICONO
// =====================================================

function crearIcono(
color
) {


return L.divIcon({

className:"",

html:

`<div style="
width:13px;
height:13px;
background:${color};
border:2px solid white;
border-radius:50%;
box-shadow:0 0 8px ${color};
"></div>`,

iconSize:[13,13],

iconAnchor:[6,6]

});

}


// =====================================================
// CSV
// =====================================================

function csvToArray(text) {


const limpio =
text.trim();


if(!limpio) {

return [];

}


const lines =
limpio.split(/\r?\n/);


if(lines.length < 2) {

return [];

}


const headers =

lines[0]
.split(",")
.map(x => x.trim());


return lines
.slice(1)
.map(line => {

const values =
line.split(",");

const obj = {};

headers.forEach(
(header,i) => {

obj[header] =
values[i] || "";

});

return obj;

});

}


// =====================================================
// PERÍODO
// =====================================================

function obtenerPeriodo() {


const radio =

document.querySelector(

'input[name="periodo"]:checked'

);


return radio

? parseInt(radio.value)

: 1;

}


// =====================================================
// HORA PERÚ
// =====================================================

function horaPeru(

fecha,

horaUTC

) {


if(
!fecha ||
!horaUTC
) {

return "--";

}


const h =

String(horaUTC)
.replace(/\D/g,"")
.padStart(4,"0");


const hh =
h.substring(0,2);

const mm =
h.substring(2,4);


const fechaUTC =

new Date(

`${fecha}T${hh}:${mm}:00Z`

);


return fechaUTC.toLocaleString(

"es-PE",

{

timeZone:"America/Lima",

day:"2-digit",

month:"2-digit",

year:"numeric",

hour:"2-digit",

minute:"2-digit",

hour12:false

}

);

}


// =====================================================
// CONSULTAR FIRMS
// =====================================================

async function cargarSensor(
sat
) {


const days =
obtenerPeriodo();


const url =

`https://firms.modaps.eosdis.nasa.gov/api/area/csv/` +

`${currentKey}/` +

`${sat.source}/` +

`${PERU_BBOX.west},${PERU_BBOX.south},${PERU_BBOX.east},${PERU_BBOX.north}/` +

`${days}`;


const response =
await fetch(url);


if(!response.ok) {

throw new Error(

`${sat.name}: HTTP ${response.status}`

);

}


const text =
await response.text();


return csvToArray(text);

}


// =====================================================
// LIMPIAR INCENDIOS
// =====================================================

function limpiarIncendios() {


fireLayers.forEach(
item => {

if(
map.hasLayer(item.marker)
) {

map.removeLayer(
item.marker
);

}

});


fireLayers = [];

}


// =====================================================
// LIMPIAR CLÚSTERES
// =====================================================

function limpiarClusters() {


clusterLayers.forEach(
layer => {

if(
map.hasLayer(layer)
) {

map.removeLayer(
layer
);

}

});


clusterLayers = [];


document
.getElementById(
"clusterList"
)
.innerHTML = "";

}


// =====================================================
// CARGAR MAP KEY
// =====================================================

function cargarIncendios() {


const key =

document
.getElementById(
"mapKey"
)
.value
.trim();


if(!key) {

document
.getElementById(
"status"
)
.innerHTML =

"⚠️ Introduce tu MAP_KEY de NASA FIRMS.";

return;

}


currentKey =
key;


localStorage.setItem(
"firms_map_key",
key
);


actualizarIncendios(true);

}


// =====================================================
// ACTUALIZAR INCENDIOS
// =====================================================

async function actualizarIncendios(
forzado=false
) {


if(!currentKey) {

return;

}


if(actualizando) {

return;

}


actualizando = true;


const inicio =
new Date();


const periodo =
obtenerPeriodo();


document
.getElementById(
"status"
)
.innerHTML =

"⏳ Consultando incendios de Perú...";


try {


limpiarIncendios();

limpiarClusters();


puntosDetectados = [];


let total = 0;


let conteos = {

"NOAA-20":0,

"NOAA-21":0,

"Suomi-NPP":0

};


let ultimaFecha = null;


// ===================================================
// CONSULTAR LOS 3 SATÉLITES
// ===================================================

for(
const sat of SATELLITES
) {


try {


const datos =
await cargarSensor(
sat
);


datos.forEach(
fire => {


const lat =

parseFloat(
fire.latitude
);


const lon =

parseFloat(
fire.longitude
);


if(
Number.isNaN(lat) ||
Number.isNaN(lon)
) {

return;

}


// =================================================
// SOLO PERÚ
// =================================================

if(
!puntoDentroPeru(
lat,
lon
)
) {

return;

}


const fecha =
fire.acq_date || "--";


const horaUTC =
fire.acq_time || "--";


const horaLocal =

horaPeru(
fecha,
horaUTC
);


const frp =
fire.frp || "--";


const confidence =
fire.confidence || "--";


const bright =
fire.bright_ti4 || "--";


const daynight =
fire.daynight || "--";


// =================================================
// GUARDAR PARA CLUSTERS
// =================================================

puntosDetectados.push({

lat:lat,

lon:lon,

satelite:sat.name,

color:sat.color,

fecha:fecha,

horaUTC:horaUTC,

horaLocal:horaLocal,

frp:parseFloat(frp) || 0,

confidence:confidence

});


conteos[sat.name]++;


total++;


// =================================================
// MARCADOR
// =================================================

const marker =

L.marker(

[lat,lon],

{

icon:
crearIcono(
sat.color
)

}

);


marker.bindPopup(`

<div style="
color:#111;
min-width:250px;
">

<h3 style="
color:${sat.color};
margin-top:0;
">

🔥 Incendio VIIRS

</h3>


<b>🇵🇪 País:</b>

PERÚ

<br><br>


<b>🛰️ Satélite:</b>

${sat.name}

<br><br>


<b>📍 Latitud:</b>

${lat.toFixed(5)}°

<br>


<b>📍 Longitud:</b>

${lon.toFixed(5)}°

<br><br>


<b>📅 Fecha:</b>

${fecha}

<br>


<b>🕐 Hora Perú:</b>

${horaLocal}

<br>


<small>
Hora original:
${horaUTC} UTC
</small>

<br><br>


<b>🔥 FRP:</b>

${frp} MW

// =====================================================
// TLE
// =====================================================

async function obtenerTLE(
sat
) {


const url =

`https://celestrak.org/NORAD/elements/gp.php?CATNR=${sat.norad}&FORMAT=TLE`;


const response =
await fetch(url);


if(!response.ok) {

throw new Error(
"TLE no disponible"
);

}


const text =
await response.text();


const lines =

text
.trim()
.split(/\r?\n/)
.filter(Boolean);


if(lines.length >= 3) {

return {

line1:lines[1],

line2:lines[2]

};

}


throw new Error(
"TLE inválido"
);

}


// =====================================================
// POSICIÓN SATÉLITE
// =====================================================

function posicionSatelite(
satrec,
date
) {


const pv =

satellite.propagate(
satrec,
date
);


if(!pv.position) {

return null;

}


const gmst =

satellite.gstime(
date
);


const geo =

satellite.eciToGeodetic(
pv.position,
gmst
);


return [

satellite.degreesLat(
geo.latitude
),

satellite.degreesLong(
geo.longitude
)

];

}


// =====================================================
// DIBUJAR ÓRBITA
// =====================================================

async function dibujarOrbita(
sat
) {


try {


const tle =
await obtenerTLE(
sat
);


const satrec =

satellite.twoline2satrec(

tle.line1,

tle.line2

);


const puntos = [];

const ahora =
new Date();


for(
let minuto=-60;

minuto<=60;

minuto++

) {


const fecha =

new Date(

ahora.getTime()
+
minuto*60000

);


const pos =

posicionSatelite(
satrec,
fecha
);


if(pos) {

puntos.push(pos);

}

}


const linea =

L.polyline(

puntos,

{

color:sat.color,

weight:2,

opacity:.8,

dashArray:"7,5"

}

);


linea.addTo(map);


orbitLayers.push({

layer:linea,

satelite:sat.name

});


const actual =

posicionSatelite(
satrec,
ahora
);


if(actual) {


const marcador =

L.circleMarker(

actual,

{

radius:6,

color:"white",

weight:2,

fillColor:sat.color,

fillOpacity:1

}

);


marcador.addTo(map);


marcador.bindPopup(`

<b>🛰️ ${sat.name}</b>

<br><br>

🇵🇪 Fire Monitor Perú

<br><br>

Latitud:
${actual[0].toFixed(3)}°

<br>

Longitud:
${actual[1].toFixed(3)}°

`);


orbitLayers.push({

layer:marcador,

satelite:sat.name

});

}


}
catch(error) {

console.warn(
sat.name,
error
);

}

}
