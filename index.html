<script>


// =====================================================
// MAPA
// =====================================================

const map =
L.map("map")
.setView(
[-9.19, -75.015],
5
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:
"&copy; OpenStreetMap contributors"
}
).addTo(map);


L.control.scale().addTo(map);


// =====================================================
// ÁREA DE CONSULTA
// =====================================================

const PERU_BBOX = {

west: -81.5,

south: -18.5,

east: -68.5,

north: 0.5

};


// =====================================================
// POLÍGONO SIMPLIFICADO DEL PERÚ
// =====================================================

const PERU_POLYGON = [

[-18.35,-70.37],

[-17.55,-69.45],

[-16.40,-69.00],

[-15.10,-69.40],

[-13.70,-68.90],

[-12.50,-68.75],

[-11.00,-69.00],

[-9.50,-70.00],

[-8.30,-70.50],

[-7.20,-72.00],

[-6.00,-73.50],

[-4.50,-74.00],

[-3.50,-75.00],

[-2.50,-76.00],

[-1.50,-77.00],

[-0.10,-78.00],

[-0.05,-79.50],

[-1.50,-80.80],

[-3.50,-80.90],

[-5.00,-80.70],

[-6.00,-80.90],

[-8.00,-80.70],

[-10.00,-79.80],

[-12.00,-77.50],

[-14.00,-76.00],

[-15.50,-75.50],

[-17.00,-74.00],

[-18.35,-70.37]

];


// Dibujar límite

const peruBoundary =

L.polygon(
PERU_POLYGON,
{
color:"#facc15",
weight:2,
fillColor:"#facc15",
fillOpacity:0.04
}
).addTo(map);


// =====================================================
// VARIABLES
// =====================================================

let currentKey = "";

let fireLayers = [];

let orbitLayers = [];

let actualizando = false;

let proximaActualizacion = null;

const INTERVALO = 15 * 60 * 1000;


// =====================================================
// SATÉLITES
// =====================================================

const SATELLITES = [

{
name:"NOAA-20",
source:"VIIRS_NOAA20_NRT",
norad:"43013",
color:"#38bdf8"
},

{
name:"NOAA-21",
source:"VIIRS_NOAA21_NRT",
norad:"54234",
color:"#c084fc"
},

{
name:"Suomi-NPP",
source:"VIIRS_SNPP_NRT",
norad:"37849",
color:"#4ade80"
}

];


// =====================================================
// ¿PUNTO DENTRO DE PERÚ?
// =====================================================

function puntoDentroPeru(
lat,
lon
) {

let dentro = false;


for(
let i = 0,
j = PERU_POLYGON.length - 1;

i < PERU_POLYGON.length;

j = i++
) {

const lati =
PERU_POLYGON[i][0];

const loni =
PERU_POLYGON[i][1];

const latj =
PERU_POLYGON[j][0];

const lonj =
PERU_POLYGON[j][1];


const intersect =

((loni > lon) !==
 (lonj > lon))

&&

(
lat <
(latj - lati) *
(lon - loni) /
(lonj - loni)
+
lati
);


if(intersect) {

dentro = !dentro;

}

}


return dentro;

}


// =====================================================
// ICONO
// =====================================================

function crearIcono(color) {

return L.divIcon({

className:"",

html:

`<div style="
width:13px;
height:13px;
background:${color};
border:2px solid white;
border-radius:50%;
box-shadow:0 0 8px ${color};
"></div>`,

iconSize:[13,13],

iconAnchor:[6,6]

});

}


// =====================================================
// CSV
// =====================================================

function csvToArray(text) {

const limpio =
text.trim();


if(!limpio) {

return [];

}


const lines =
limpio.split(/\r?\n/);


if(lines.length < 2) {

return [];

}


const headers =
lines[0]
.split(",")
.map(x => x.trim());


return lines
.slice(1)
.map(line => {

const values =
line.split(",");

const obj = {};

headers.forEach(
(header,i) => {

obj[header] =
values[i] || "";

});

return obj;

});

}


// =====================================================
// PERÍODO
// =====================================================

function obtenerPeriodo() {

const radio =

document.querySelector(
'input[name="periodo"]:checked'
);

return radio
? parseInt(radio.value)
: 1;

}


// =====================================================
// HORA PERÚ
// =====================================================

function horaPeru(
fecha,
horaUTC
) {

if(
!fecha ||
!horaUTC
) {

return "--";

}


const h =

String(horaUTC)
.replace(/\D/g,"")
.padStart(4,"0");


const hh =
h.substring(0,2);

const mm =
h.substring(2,4);


const fechaUTC =

new Date(

`${fecha}T${hh}:${mm}:00Z`

);


return fechaUTC.toLocaleString(
"es-PE",
{
timeZone:"America/Lima",
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit",
hour12:false
}
);

}


// =====================================================
// CONSULTAR FIRMS
// =====================================================

async function cargarSensor(sat) {

const days =
obtenerPeriodo();


const url =

`https://firms.modaps.eosdis.nasa.gov/api/area/csv/` +

`${currentKey}/` +

`${sat.source}/` +

`${PERU_BBOX.west},${PERU_BBOX.south},${PERU_BBOX.east},${PERU_BBOX.north}/` +

`${days}`;


const response =
await fetch(url);


if(!response.ok) {

throw new Error(
`${sat.name}: HTTP ${response.status}`
);

}


const text =
await response.text();


return csvToArray(text);

}


// =====================================================
// LIMPIAR
// =====================================================

function limpiarIncendios() {

fireLayers.forEach(
item => {

if(
map.hasLayer(item.marker)
) {

map.removeLayer(
item.marker
);

}

});

fireLayers = [];

}


// =====================================================
// CARGAR MAP KEY
// =====================================================

function cargarIncendios() {

const key =

document
.getElementById("mapKey")
.value
.trim();


if(!key) {

document
.getElementById("status")
.innerHTML =
"⚠️ Introduce tu MAP_KEY.";

return;

}


currentKey =
key;


localStorage.setItem(
"firms_map_key",
key
);


actualizarIncendios(true);

}


// =====================================================
// ACTUALIZAR
// =====================================================

async function actualizarIncendios(
forzado=false
) {


if(!currentKey) {

return;

}


if(actualizando) {

return;

}


actualizando = true;


const inicio =
new Date();


const periodo =
obtenerPeriodo();


document
.getElementById("status")
.innerHTML =

"⏳ Consultando NASA FIRMS para Perú...";


try {


limpiarIncendios();


let total = 0;

let ultimaFecha = null;

let conteos = {

"NOAA-20":0,

"NOAA-21":0,

"Suomi-NPP":0

};


for(
const sat of SATELLITES
) {


try {


const datos =
await cargarSensor(sat);


datos.forEach(
fire => {


const lat =
parseFloat(
fire.latitude
);


const lon =
parseFloat(
fire.longitude
);


if(
Number.isNaN(lat) ||
Number.isNaN(lon)
) {

return;

}


// =================================================
// FILTRO REAL DE PERÚ
// =================================================

if(
!puntoDentroPeru(
lat,
lon
)
) {

return;

}


conteos[sat.name]++;


const marker =

L.marker(
[lat,lon],
{
icon:
crearIcono(
sat.color
)
}
);


const fecha =
fire.acq_date || "--";


const horaUTC =
fire.acq_time || "--";


const horaLocal =

horaPeru(
fecha,
horaUTC
);


const frp =
fire.frp || "--";


const confidence =
fire.confidence || "--";


const bright =
fire.bright_ti4 || "--";


const daynight =
fire.daynight || "--";


marker.bindPopup(`

<div style="
color:#111;
min-width:240px;
">

<h3 style="
color:${sat.color};
margin-top:0;
">

🔥 Incendio detectado

</h3>


<b>🇵🇪 País:</b>

PERÚ

<br><br>


<b>🛰️ Satélite:</b>

${sat.name}

<br><br>


<b>📍 Latitud:</b>

${lat.toFixed(5)}°

<br>


<b>📍 Longitud:</b>

${lon.toFixed(5)}°

<br><br>


<b>📅 Fecha:</b>

${fecha}

<br>


<b>🕐 Hora Perú:</b>

${horaLocal}

<br>


<small>

Hora original:
${horaUTC} UTC

</small>

<br><br>


<b>🔥 FRP:</b>

${frp} MW

<br>


<b>🎯 Confianza:</b>

${confidence}

<br>


<b>🌡️ Brightness T4:</b>

${bright}

<br>


<b>☀️ Día/Noche:</b>

${daynight}

<br><br>


<small>

NASA FIRMS / VIIRS NRT

</small>

</div>

`);


marker.addTo(map);


fireLayers.push({

marker:marker,

satelite:sat.name

});


total++;


if(fecha !== "--") {

const fechaHora =
`${fecha} ${horaUTC}`;

if(
!ultimaFecha ||
fechaHora > ultimaFecha
) {

ultimaFecha =
fechaHora;

}

}

});

}
catch(error) {

console.error(
sat.name,
error
);

conteos[sat.name] =
"ERROR";

}

}


// =====================================================
// ESTADÍSTICAS
// =====================================================

document
.getElementById("total")
.textContent =
total;


let ultimaHora =
"--";


if(ultimaFecha) {

const partes =
ultimaFecha.split(" ");

ultimaHora =
horaPeru(
partes[0],
partes[1]
);

}


document
.getElementById("ultima")
.textContent =
ultimaHora === "--"
? "--"
: ultimaHora.substring(
12,
17
);


// =====================================================
// PRÓXIMA ACTUALIZACIÓN
// =====================================================

proximaActualizacion =
Date.now() + INTERVALO;


const horaActual =

inicio.toLocaleTimeString(
"es-PE",
{
timeZone:"America/Lima",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
}
);


document
.getElementById("status")
.innerHTML =

`

<span class="live">
● SISTEMA ACTIVO
</span>

<br>

🇵🇪 Solo incendios dentro del Perú

<br>

🔥 Total:
${total}

<br>

🛰️ NOAA-20:
${conteos["NOAA-20"]}

<br>

🛰️ NOAA-21:
${conteos["NOAA-21"]}

<br>

🛰️ Suomi-NPP:
${conteos["Suomi-NPP"]}

<br>

🕐 Actualizado:
${horaActual} 🇵🇪

<br>

🔄 Próxima actualización:
<span id="contador">
15:00
</span>

`;


actualizarVisibilidad();


}
catch(error) {

console.error(error);


document
.getElementById("status")
.innerHTML =

`

❌ Error FIRMS

<br>

${error.message}

`;

}
finally {

actualizando =
false;

}

}

// VISIBILIDAD
// =====================================================

function actualizarVisibilidad() {


const mostrar20 =
document
.getElementById("showNOAA20")
.checked;


const mostrar21 =
document

.checked;


const mostrarSNPP =

item.satelite === "NOAA-20"

mostrar =

item.satelite === "NOAA-21"
) {

mostrar =

) {

mostrar =
mostrarSNPP;

if(mostrar) {

item.marker.addTo(map);

// ÓRBITAS
// =====================================================

const o20 =

.getElementById("showOrbit20")

document
.getElementById("showOrbit21")

.getElementById("showOrbitSNPP")

item => {

) {

mostrar = o21;

item.layer.addTo(map);

}
else {

map.removeLayer(
item.layer
);

}

});

}


// =====================================================
// TLE
// =====================================================

async function obtenerTLE(sat) {


const url =

`https://celestrak.org/NORAD/elements/gp.php?CATNR=${sat.norad}&FORMAT=TLE`;


const response =
await fetch(url);


if(!response.ok) {

throw new Error(
"TLE no disponible"
);

}


const text =
await response.text();


const lines =
text
.trim()
.split(/\r?\n/)
.filter(Boolean);


if(lines.length >= 3) {

return {

line1:lines[1],

line2:lines[2]

};

}


throw new Error(
"TLE inválido"
);

}


// =====================================================
// POSICIÓN
// =====================================================

function posicionSatelite(
satrec,
date
) {


const pv =
satellite.propagate(
satrec,
date
);


if(!pv.position) {

return null;

}


const gmst =
satellite.gstime(
date
);


const geo =
satellite.eciToGeodetic(
pv.position,
gmst
);


return [

satellite.degreesLat(
geo.latitude
),

satellite.degreesLong(
geo.longitude
)

];

}


// =====================================================
// ÓRBITA
// =====================================================

async function dibujarOrbita(sat) {


try {


const tle =
await obtenerTLE(sat);


const satrec =
satellite.twoline2satrec(
tle.line1,
tle.line2
);


const puntos = [];

const ahora =
new Date();


for(
let m=-60;
m<=60;
m++
) {


const fecha =
new Date(
ahora.getTime() +
m*60000
);


const pos =
posicionSatelite(
satrec,
fecha
);


if(pos) {

puntos.push(pos);

}

}


const linea =

L.polyline(
puntos,
{
color:sat.color,
weight:2,
opacity:.8,
dashArray:"7,5"
}
);


linea.addTo(map);


orbitLayers.push({

layer:linea,

satelite:sat.name

});


const actual =
posicionSatelite(
satrec,
ahora
);


if(actual) {


const marcador =

L.circleMarker(
actual,
{
radius:6,
color:"white",
weight:2,
fillColor:sat.color,
fillOpacity:1
}
);


marcador.addTo(map);


marcador.bindPopup(`

<b>🛰️ ${sat.name}</b>

<br><br>

🇵🇪 Fire Monitor Perú

<br><br>

Latitud:
${actual[0].toFixed(3)}°

<br>

Longitud:
${actual[1].toFixed(3)}°

`);


orbitLayers.push({

layer:marcador,

satelite:sat.name

});

}


}
catch(error) {

console.warn(
sat.name,
error
);

}

}


// =====================================================
// CARGAR ÓRBITAS
// =====================================================

async function cargarOrbitas() {


orbitLayers.forEach(
item => {

map.removeLayer(
item.layer
);

});


orbitLayers = [];


for(
const sat of SATELLITES
) {

await dibujarOrbita(
sat
);

}


actualizarVisibilidad();

}


// =====================================================
// CONTADOR 15 MINUTOS
// =====================================================

setInterval(
() => {


if(!proximaActualizacion) {

return;

}


const restante =

Math.max(
0,
proximaActualizacion -
Date.now()
);


const minutos =

Math.floor(
restante / 60000
);


const segundos =

Math.floor(
(restante % 60000) /
1000
);


const reloj =

`${String(minutos).padStart(2,"0")}:` +
`${String(segundos).padStart(2,"0")}`;


const contador =
document.getElementById(
"contador"
);


if(contador) {

contador.textContent =
reloj;

}

},
1000
);


// =====================================================
// ACTUALIZACIÓN AUTOMÁTICA
// =====================================================

setInterval(
async () => {


if(!currentKey) {

return;

}


if(actualizando) {

return;

}


await actualizarIncendios();

},
INTERVALO
);


// =====================================================
// MAP KEY GUARDADA
// =====================================================

const savedKey =
localStorage.getItem(
"firms_map_key"
);


if(savedKey) {

document
.getElementById("mapKey")
.value =
savedKey;

}


// =====================================================
// INICIAR ÓRBITAS
// =====================================================

cargarOrbitas();


</script>

</body>

</html>
