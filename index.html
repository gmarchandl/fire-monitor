<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Fire Monitor Perú</title>


<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100vh;
}


/* ===============================
   ENCABEZADO
   =============================== */

.header {

  position: absolute;

  z-index: 2000;

  top: 0;
  left: 0;
  right: 0;

  height: 62px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 20px;

  background:
    rgba(15,23,42,.96);

  color: white;

  border-bottom:
    1px solid #374151;

}

.title {

  font-size: 20px;

  font-weight: bold;

}

.title span {

  color: #f97316;

}

.subtitle {

  font-size: 12px;

  color: #9ca3af;

}


/* ===============================
   PANEL
   =============================== */

.panel {

  position: absolute;

  z-index: 2000;

  top: 78px;

  left: 15px;

  width: 350px;

  max-height:
    calc(100vh - 95px);

  overflow-y: auto;

  padding: 16px;

  background:
    rgba(15,23,42,.97);

  color: white;

  border:
    1px solid #374151;

  border-radius: 12px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.5);

}

.panel h2 {

  margin: 0 0 12px;

  font-size: 17px;

}


/* ===============================
   CAMPOS
   =============================== */

.input-label {

  display: block;

  margin-top: 10px;

  margin-bottom: 5px;

  font-size: 12px;

  color: #d1d5db;

}

input[type="password"] {

  width: 100%;

  padding: 10px;

  background: #1f2937;

  color: white;

  border: 1px solid #4b5563;

  border-radius: 7px;

}


/* ===============================
   BOTONES
   =============================== */

button {

  width: 100%;

  margin-top: 9px;

  padding: 10px;

  border: none;

  border-radius: 7px;

  background: #ea580c;

  color: white;

  font-weight: bold;

  cursor: pointer;

}

button:hover {

  background: #f97316;

}


/* ===============================
   PERÍODO
   =============================== */

.section {

  margin-top: 14px;

  padding-top: 12px;

  border-top:
    1px solid #374151;

}

.section-title {

  margin-bottom: 8px;

  font-size: 13px;

  font-weight: bold;

}


/* ===============================
   CHECKBOX
   =============================== */

.check {

  display: flex;

  align-items: center;

  gap: 8px;

  margin: 8px 0;

  font-size: 12px;

  cursor: pointer;

}

.check input {

  width: auto;

  margin: 0;

  accent-color: #f97316;

}


/* ===============================
   COLORES
   =============================== */

.dot {

  width: 11px;

  height: 11px;

  border-radius: 50%;

  display: inline-block;

  flex-shrink: 0;

}

.noaa20 {

  background: #38bdf8;

  box-shadow:
    0 0 7px #38bdf8;

}

.noaa21 {

  background: #c084fc;

  box-shadow:
    0 0 7px #c084fc;

}

.snpp {

  background: #4ade80;

  box-shadow:
    0 0 7px #4ade80;

}


/* ===============================
   ESTADO
   =============================== */

.status {

  margin-top: 12px;

  padding: 9px;

  background: #1f2937;

  border-radius: 7px;

  font-size: 12px;

  color: #d1d5db;

}


/* ===============================
   ESTADÍSTICAS
   =============================== */

.stats {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 7px;

  margin-top: 10px;

}

.stat {

  background: #1f2937;

  padding: 9px;

  border-radius: 7px;

  text-align: center;

}

.stat-number {

  color: #fb923c;

  font-size: 18px;

  font-weight: bold;

}

.stat-label {

  color: #9ca3af;

  font-size: 10px;

}


/* ===============================
   ÓRBITAS
   =============================== */

.orbit20 {

  color: #38bdf8;

  font-weight: bold;

}

.orbit21 {

  color: #c084fc;

  font-weight: bold;

}

.orbitSNPP {

  color: #4ade80;

  font-weight: bold;

}


/* ===============================
   MÓVIL
   =============================== */

@media(max-width:700px) {

  .subtitle {
    display: none;
  }

  .panel {

    left: 10px;

    width:
      calc(100% - 20px);

  }

}

</style>

</head>


<body>


<!-- =========================================
     ENCABEZADO
     ========================================= -->

<div class="header">

  <div class="title">

    🔥 <span>FIRE MONITOR</span> PERÚ

  </div>

  <div class="subtitle">

    NASA FIRMS • VIIRS • NOAA

  </div>

</div>


<!-- =========================================
     MAPA
     ========================================= -->

<div id="map"></div>


<!-- =========================================
     PANEL
     ========================================= -->

<div class="panel">


<h2>
🇵🇪 Monitoreo de incendios
</h2>


<label class="input-label">

NASA FIRMS MAP_KEY

</label>


<input
id="mapKey"
type="password"
placeholder="Introduce tu MAP_KEY"
/>


<button onclick="cargarIncendios()">

🔥 CARGAR INCENDIOS

</button>


<button onclick="actualizarIncendios()">

🔄 ACTUALIZAR AHORA

</button>


<!-- =========================================
     PERÍODO
     ========================================= -->

<div class="section">

<div class="section-title">

🕐 PERÍODO DE CONSULTA

</div>


<label class="check">

<input
type="radio"
name="periodo"
value="1"
checked
>

🔥 Últimas 24 horas

</label>


<label class="check">

<input
type="radio"
name="periodo"
value="2"
>

🔥 Últimas 48 horas

</label>


<label class="check">

<input
type="radio"
name="periodo"
value="3"
>

🔥 Últimas 72 horas

</label>


<label class="check">

<input
type="radio"
name="periodo"
value="5"
>

🔥 Últimos 5 días

</label>

</div>


<!-- =========================================
     SATÉLITES
     ========================================= -->

<div class="section">

<div class="section-title">

🛰️ SATÉLITES VIIRS

</div>


<label class="check">

<input
type="checkbox"
id="showNOAA20"
checked
onchange="actualizarVisibilidad()"
/>

<span class="dot noaa20"></span>

NOAA-20

</label>


<label class="check">

<input
type="checkbox"
id="showNOAA21"
checked
onchange="actualizarVisibilidad()"
/>

<span class="dot noaa21"></span>

NOAA-21

</label>


<label class="check">

<input
type="checkbox"
id="showSNPP"
checked
onchange="actualizarVisibilidad()"
/>

<span class="dot snpp"></span>

Suomi-NPP

</label>

</div>


<!-- =========================================
     ÓRBITAS
     ========================================= -->

<div class="section">

<div class="section-title">

🛰️ ÓRBITAS

</div>


<label class="check">

<input
type="checkbox"
id="showOrbit20"
checked
onchange="actualizarVisibilidad()"
/>

<span class="orbit20">

━━

</span>

Órbita NOAA-20

</label>


<label class="check">

<input
type="checkbox"
id="showOrbit21"
checked
onchange="actualizarVisibilidad()"
/>

<span class="orbit21">

━━

</span>

Órbita NOAA-21

</label>


<label class="check">

<input
type="checkbox"
id="showOrbitSNPP"
checked
onchange="actualizarVisibilidad()"
/>

<span class="orbitSNPP">

━━

</span>

Órbita Suomi-NPP

</label>

</div>


<!-- =========================================
     ESTADÍSTICAS
     ========================================= -->

<div class="stats">


<div class="stat">

<div
class="stat-number"
id="total"
>
0
</div>

<div class="stat-label">
DETECCIONES
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="ultima"
>
--
</div>

<div class="stat-label">
ÚLTIMA HORA UTC
</div>

</div>


</div>


<!-- =========================================
     ESTADO
     ========================================= -->

<div
class="status"
id="status"
>

Esperando MAP_KEY...

</div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script
src="https://unpkg.com/satellite.js/dist/satellite.min.js">
</script>


<script>


// ======================================================
// MAPA
// ======================================================

const map =
L.map("map")
.setView(
  [-9.19,-75.015],
  5
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

attribution:
"&copy; OpenStreetMap contributors"

}
)
.addTo(map);


L.control.scale()
.addTo(map);


// ======================================================
// ÁREA PERÚ
// ======================================================

const PERU = {

west: -81.5,

south: -18.5,

east: -68.5,

north: 0.5

};


// ======================================================
// VARIABLES
// ======================================================

let currentKey = "";

let fireLayers = [];

let orbitLayers = [];


// ======================================================
// SATÉLITES
// ======================================================

const SATELLITES = [

{

name:
"NOAA-20",

source:
"VIIRS_NOAA20_NRT",

norad:
"43013",

color:
"#38bdf8"

},

{

name:
"NOAA-21",

source:
"VIIRS_NOAA21_NRT",

norad:
"54234",

color:
"#c084fc"

},

{

name:
"Suomi-NPP",

source:
"VIIRS_SNPP_NRT",

norad:
"37849",

color:
"#4ade80"

}

];


// ======================================================
// ICONO
// ======================================================

function crearIcono(color) {

return L.divIcon({

className:"",

html:

`<div style="
width:13px;
height:13px;
background:${color};
border:2px solid white;
border-radius:50%;
box-shadow:0 0 8px ${color};
"></div>`,

iconSize:[13,13],

iconAnchor:[6,6]

});

}


// ======================================================
// CSV
// ======================================================

function csvToArray(text) {

const lines =
text
.trim()
.split(/\r?\n/);


if(lines.length < 2) {

return [];

}


const headers =
lines[0]
.split(",")
.map(x => x.trim());


return lines
.slice(1)
.map(line => {

const values =
line.split(",");

const obj = {};

headers.forEach(
(header,i) => {

obj[header] =
values[i] !== undefined
? values[i].trim()
: "";

});

return obj;

});

}


// ======================================================
// PERÍODO
// ======================================================

function obtenerPeriodo() {

const seleccionado =
document.querySelector(
'input[name="periodo"]:checked'
);

return seleccionado
? parseInt(seleccionado.value)
: 1;

}


// ======================================================
// CARGAR SENSOR
// ======================================================

async function cargarSensor(sat) {


const days =
obtenerPeriodo();


const url =

`https://firms.modaps.eosdis.nasa.gov/api/area/csv/` +

`${currentKey}/` +

`${sat.source}/` +

`${PERU.west},${PERU.south},${PERU.east},${PERU.north}/` +

`${days}`;


console.log(
"FIRMS:",
url
);


const response =
await fetch(url);


if(!response.ok) {

throw new Error(
`${sat.name}: HTTP ${response.status}`
);

}


const text =
await response.text();


return csvToArray(text);

}


// ======================================================
// LIMPIAR PUNTOS
// ======================================================

function limpiarIncendios() {


fireLayers.forEach(
item => {

if(
map.hasLayer(item.marker)
) {

map.removeLayer(
item.marker
);

}

}
);


fireLayers = [];

}


// ======================================================
// CARGAR INCENDIOS
// ======================================================

async function cargarIncendios() {


const key =
document
.getElementById("mapKey")
.value
.trim();


if(!key) {

document
.getElementById("status")
.innerHTML =
"⚠️ Introduce tu MAP_KEY.";

return;

}


currentKey = key;


localStorage.setItem(
"firms_map_key",
key
);


await actualizarIncendios();

}


// ======================================================
// ACTUALIZAR
// ======================================================

async function actualizarIncendios() {


if(!currentKey) {

document
.getElementById("status")
.innerHTML =
"⚠️ Primero introduce tu MAP_KEY.";

return;

}


document
.getElementById("status")
.innerHTML =
"⏳ Consultando NASA FIRMS...";


limpiarIncendios();


const periodo =
obtenerPeriodo();


try {


let total = 0;

let fechas = [];

let mensajes = [];


for(
const sat of SATELLITES
) {


try {


const datos =
await cargarSensor(sat);


if(datos.length === 0) {

mensajes.push(
`${sat.name}: 0`
);

continue;

}


mensajes.push(
`${sat.name}: ${datos.length}`
);


datos.forEach(
fire => {


const lat =
parseFloat(
fire.latitude
);


const lon =
parseFloat(
fire.longitude
);


if(
Number.isNaN(lat) ||
Number.isNaN(lon)
) {

return;

}


// ============================================
// MARCADOR
// ============================================

const marker =
L.marker(
[lat,lon],
{
icon:
crearIcono(
sat.color
)
}
);


// ============================================
// DATOS
// ============================================

const fecha =
fire.acq_date || "--";


const hora =
fire.acq_time || "--";


const frp =
fire.frp || "--";


const confidence =
fire.confidence || "--";


const bright =
fire.bright_ti4 || "--";


const daynight =
fire.daynight || "--";


const scan =
fire.scan || "--";


const track =
fire.track || "--";


// ============================================
// POPUP
// ============================================

marker.bindPopup(`

<div style="
color:#111;
min-width:230px;
">

<h3 style="
color:${sat.color};
margin-top:0;
">

🔥 Incendio VIIRS

</h3>


<b>🛰️ Satélite:</b>

${sat.name}

<br><br>


<b>📍 Latitud:</b>

${lat.toFixed(5)}°

<br>


<b>📍 Longitud:</b>

${lon.toFixed(5)}°

<br><br>


<b>📅 Fecha:</b>

${fecha}

<br>


<b>🕐 Hora UTC:</b>

${hora}

<br><br>


<b>🔥 FRP:</b>

${frp} MW

<br>


<b>🎯 Confianza:</b>

${confidence}

<br>


<b>🌡️ Brightness T4:</b>

${bright}

<br>


<b>☀️ Día/Noche:</b>

${daynight}

<br><br>


<b>Scan:</b>
${scan}

<br>

<b>Track:</b>
${track}

<br><br>


<small>

NASA FIRMS / VIIRS NRT

</small>

</div>

`);


marker.addTo(map);


fireLayers.push({

marker:

marker,

satelite:

sat.name

});


total++;


if(fecha && hora) {

fechas.push(
`${fecha} ${hora}`
);

}

});

}
catch(error) {

console.error(
sat.name,
error
);

mensajes.push(
`${sat.name}: ERROR`
);

}

}


// ==================================================
// ESTADÍSTICAS
// ==================================================

document
.getElementById("total")
.textContent =
total;


let ultima = "--";


if(fechas.length > 0) {

fechas.sort();


ultima =
fechas[
fechas.length - 1
]
.split(" ")[1]
.substring(0,4);

}


document
.getElementById("ultima")
.textContent =
ultima;


// ==================================================
// MENSAJE
// ==================================================

const ahora =
new Date()
.toLocaleTimeString(
"es-PE",
{
hour:"2-digit",
minute:"2-digit"
}
);


document
.getElementById("status")
.innerHTML =

`✅ ${total} detecciones encontradas.<br>
📅 Período: ${periodo} día(s)<br>
🛰️ ${mensajes.join(" • ")}<br>
🔄 Actualizado: ${ahora} hora local`;


actualizarVisibilidad();


}
catch(error) {


console.error(error);


document
.getElementById("status")
.innerHTML =

`❌ Error FIRMS:<br>
${error.message}`;

}

}


// ======================================================
// VISIBILIDAD
// ======================================================

function actualizarVisibilidad() {


const mostrar20 =
document
.getElementById("showNOAA20")
.checked;


const mostrar21 =
document
.getElementById("showNOAA21")
.checked;


const mostrarSNPP =
document
.getElementById("showSNPP")
.checked;


fireLayers.forEach(
item => {


let mostrar = true;


if(
item.satelite ===
"NOAA-20"
) {

mostrar =
mostrar20;

}


if(
item.satelite ===
"NOAA-21"
) {

mostrar =
mostrar21;

}


if(
item.satelite ===
"Suomi-NPP"
) {

mostrar =
mostrarSNPP;

}


if(mostrar) {

if(
!map.hasLayer(
item.marker
)
) {

item.marker
.addTo(map);

}

}
else {

if(
map.hasLayer(
item.marker
)
) {

map.removeLayer(
item.marker
);

}

}

});


// ======================================================
// ÓRBITAS
// ======================================================

const orbit20 =
document
.getElementById("showOrbit20")
.checked;


const orbit21 =
document
.getElementById("showOrbit21")
.checked;


const orbitSNPP =
document
.getElementById("showOrbitSNPP")
.checked;


orbitLayers.forEach(
item => {


let mostrar = true;


if(
item.satelite ===
"NOAA-20"
) {

mostrar =
orbit20;

}


if(
item.satelite ===
"NOAA-21"
) {

mostrar =
orbit21;

}


if(
item.satelite ===
"Suomi-NPP"
) {

mostrar =
orbitSNPP;

}


if(mostrar) {

if(
!map.hasLayer(
item.layer
)
) {

item.layer
.addTo(map);

}

}
else {

if(
map.hasLayer(
item.layer
)
) {

map.removeLayer(
item.layer
);

}

}

});

}


// ======================================================
// OBTENER TLE
// ======================================================

async function obtenerTLE(sat) {


const url =

`https://celestrak.org/NORAD/elements/gp.php?CATNR=${sat.norad}&FORMAT=TLE`;


const response =
await fetch(url);


if(!response.ok) {

throw new Error(
`TLE ${sat.name}: HTTP ${response.status}`
);

}


const text =
await response.text();


const lines =
text
.trim()
.split(/\r?\n/)
.map(x => x.trim())
.filter(Boolean);


if(lines.length >= 3) {

return {

line1:
lines[1],

line2:
lines[2]

};

}


throw new Error(
`TLE no encontrado: ${sat.name}`
);

}


// ======================================================
// POSICIÓN
// ======================================================

function posicionSatelite(
satrec,
date
) {


const pv =
satellite.propagate(
satrec,
date
);


if(!pv.position) {

return null;

}


const gmst =
satellite.gstime(
date
);


const geo =
satellite.eciToGeodetic(
pv.position,
gmst
);


return [

satellite.degreesLat(
geo.latitude
),

satellite.degreesLong(
geo.longitude
)

];

}


// ======================================================
// DIBUJAR ÓRBITA
// ======================================================

async function dibujarOrbita(sat) {


try {


const tle =
await obtenerTLE(sat);


const satrec =
satellite.twoline2satrec(
tle.line1,
tle.line2
);


const puntos = [];


const ahora =
new Date();


// ==================================================
// ±60 MINUTOS
// ==================================================

for(
let minuto=-60;

minuto<=60;

minuto++
) {


const fecha =
new Date(

ahora.getTime()
+
minuto*60000

);


const pos =
posicionSatelite(
satrec,
fecha
);


if(pos) {

puntos.push(pos);

}

}


// ==================================================
// LÍNEA
// ==================================================

const linea =
L.polyline(
puntos,
{

color:
sat.color,

weight:2,

opacity:.85,

dashArray:
"7,5"

}
);


linea.addTo(map);


orbitLayers.push({

layer:
linea,

satelite:
sat.name

});


// ==================================================
// POSICIÓN ACTUAL
// ==================================================

const actual =
posicionSatelite(
satrec,
ahora
);


if(actual) {


const marker =
L.circleMarker(
actual,
{

radius:6,

color:"white",

weight:2,

fillColor:
sat.color,

fillOpacity:1

}
);


marker.addTo(map);


marker.bindPopup(`

<div style="
color:#111;
">

<b>🛰️ ${sat.name}</b>

<br><br>

Posición orbital estimada

<br><br>

Latitud:
${actual[0].toFixed(3)}°

<br>

Longitud:
${actual[1].toFixed(3)}°

<br><br>

NORAD:
${sat.norad}

</div>

`);


orbitLayers.push({

layer:
marker,

satelite:
sat.name

});

}


}
catch(error) {

console.warn(
error
);

}

}


// ======================================================
// CARGAR ÓRBITAS
// ======================================================

async function cargarOrbitas() {


orbitLayers.forEach(
item => {

if(
map.hasLayer(
item.layer
)
) {

map.removeLayer(
item.layer
);

}

});


orbitLayers = [];


for(
const sat of SATELLITES
) {

await dibujarOrbita(
sat
);

}


actualizarVisibilidad();

}


// ======================================================
// MAPA INICIAL
// ======================================================

cargarOrbitas();


// ======================================================
// MAP_KEY GUARDADA
// ======================================================

const savedKey =
localStorage.getItem(
"firms_map_key"
);


if(savedKey) {

document
.getElementById("mapKey")
.value =
savedKey;

}


// ======================================================
// ACTUALIZACIÓN AUTOMÁTICA
// ======================================================

setInterval(
() => {

if(currentKey) {

actualizarIncendios();

}

cargarOrbitas();

},
15*60*1000
);


</script>

</body>

</html>
