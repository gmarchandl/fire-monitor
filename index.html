// =====================================================

const CONFIG = {

    // -------------------------------------------------

    // -------------------------------------------------

    // -------------------------------------------------

    MAX_CONFIRMATION_TIME_MIN:

    // -------------------------------------------------

    // -------------------------------------------------

    // -------------------------------------------------

    MIN_FRP:

    // -------------------------------------------------

    // -------------------------------------------------

    MIN_T4:
        320,

    // -------------------------------------------------
    // DIFERENCIA TÉRMICA
    //
    // ΔT = T4 - T5
    // -------------------------------------------------

    MIN_DELTA_T:
        10,

    STRONG_DELTA_T:
        20,

    // -------------------------------------------------
    // ACTUALIZACIÓN
    // 15 minutos
    // -------------------------------------------------

    INTERVALO:
        15 * 60 * 1000

};


// =====================================================

const map = L.map("map", {

const mapaHibrido = L.layerGroup([

]);

mapaHibrido.addTo(map);


// =====================================================
// CAPAS DE INCENDIOS

let capaIncendios =
    L.layerGroup().addTo(map);

let capaClusters =
    L.layerGroup().addTo(map);


// =====================================================
// FECHA ACTUAL EN PERÚ
// =====================================================

function obtenerFechaPeru() {

    const ahora = new Date();

    return new Intl.DateTimeFormat(
        "en-CA",
        {

            timeZone:
                "America/Lima",

            year: "numeric",
            month: "2-digit",
            day: "2-digit"

        }

    ).format(ahora);

}


// =====================================================
// DISTANCIA HAVERSINE
// =====================================================

function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}


// =====================================================
// TIEMPO DE ADQUISICIÓN
// =====================================================

function fechaDeteccion(d) {

    if (!d.acq_date)
        return null;

    const fecha =
        String(d.acq_date);

    let hora =
        String(d.acq_time || "0000")
        .padStart(4, "0");

    hora =
        hora.substring(0, 2) +
        ":" +
        hora.substring(2, 4);

    return new Date(
        `${fecha}T${hora}:00Z`
    );

}


// =====================================================
// NORMALIZAR DETECCIÓN
// =====================================================

function normalizarDeteccion(
    d,
    sensor
) {

    const latitude =
        Number(d.latitude);

    const longitude =
        Number(d.longitude);

    const t4 =
        Number(
            d.bright_ti4 ??
            d.bright_ti ??
            d.temperature ??
            NaN
        );

    const t5 =
        Number(
            d.bright_ti5 ??
            NaN
        );

    const frp =
        Number(
            d.frp ??
            0
        );

    let deltaT =
        NaN;

    if (
        Number.isFinite(t4) &&
        Number.isFinite(t5)
    ) {

        deltaT =
            t4 - t5;

    }

    return {

        ...d,

        sensor,

        latitude,

        longitude,

        t4,

        t5,

        deltaT,

        frp,

        acquisitionDate:
            fechaDeteccion(d)

    };

}


// =====================================================
// PARSER CSV
// =====================================================

function parseCSV(text) {

    const filas = [];
    let fila = [];
    let campo = "";
    let dentroComillas = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const c =
            text[i];

        const siguiente =
            text[i + 1];

        if (c === '"' && siguiente === '"') {

            campo += '"';

            i++;

            continue;

        }

        if (c === '"') {

            dentroComillas =
                !dentroComillas;

            continue;

        }

        if (c === "," && !dentroComillas) {

            fila.push(campo);

            campo = "";

            continue;

        }

        if (
            (c === "\n" || c === "\r") &&
            !dentroComillas
        ) {

            if (
                c === "\r" &&
                siguiente === "\n"
            ) {

                i++;

            }

            fila.push(campo);

            campo = "";

            if (fila.some(x => x !== "")) {

                filas.push(fila);

            }

            fila = [];

            continue;

        }

        campo += c;

    }

    if (campo.length || fila.length) {

        fila.push(campo);

        filas.push(fila);

    }

    if (filas.length < 2)
        return [];

    const encabezados =
        filas[0].map(
            x =>
                x
                .trim()
                .replace(/^"|"$/g, "")
        );

    return filas
        .slice(1)
        .map(fila => {

            const objeto = {};

            encabezados.forEach(
                (h, i) => {

                    objeto[h] =
                        (fila[i] ?? "")
                        .trim();

                }
            );

            return objeto;

        });

}


// =====================================================
// CONSULTAR FIRMS
// =====================================================

async function consultarFIRMS(
    mapKey,
    source
) {

    const fecha =
        obtenerFechaPeru();

    const url =
        "https://firms.modaps.eosdis.nasa.gov/" +
        "api/area/csv/" +

        encodeURIComponent(mapKey) +
        "/" +

        encodeURIComponent(source) +
        "/" +

        CONFIG.PERU_BBOX +
        "/1/" +

        fecha;

    console.log(
        "FIRMS:",
        source,
        fecha
    );

    const respuesta =
        await fetch(
            url,
            {

                cache:
                    "no-store"

            }
        );

    if (!respuesta.ok) {

        throw new Error(
            `${source}: HTTP ${respuesta.status}`
        );

    }

    const texto =
        await respuesta.text();

    if (
        !texto ||
        texto.trim().length === 0
    ) {

        return [];

    }

    return parseCSV(texto)
        .map(
            d =>
                normalizarDeteccion(
                    d,
                    source
                )
        )
        .filter(
            d =>
                Number.isFinite(
                    d.latitude
                ) &&
                Number.isFinite(
                    d.longitude
                )
        );

}


// =====================================================
// CONSULTAR TODOS LOS SENSORES
// =====================================================

async function descargarDatos() {

    const mapKey =
        document
        .getElementById("mapKey")
        .value
        .trim();

    if (!mapKey) {

        throw new Error(
            "Debe introducir la FIRMS MAP_KEY."
        );

    }

    const fecha =
        obtenerFechaPeru();

    actualizarEstado(
        `Consultando FIRMS para Perú: ${fecha}...`
    );


    // -------------------------------------------------
    // VIIRS
    // -------------------------------------------------

    const fuentesVIIRS = [

        "VIIRS_SNPP_NRT",

        "VIIRS_NOAA20_NRT",

        "VIIRS_NOAA21_NRT"

    ];


    const resultadosVIIRS =
        await Promise.all(

            fuentesVIIRS.map(
                fuente =>
                    consultarFIRMS(
                        mapKey,
                        fuente
                    )
                    .catch(error => {

                        console.warn(
                            fuente,
                            error
                        );

                        return [];

                    })
            )

        );


    const viirs =
        resultadosVIIRS
        .flat();


    // -------------------------------------------------
    // MODIS
    // -------------------------------------------------

    let modis = [];

    try {

        modis =
            await consultarFIRMS(
                mapKey,
                "MODIS_NRT"
            );

    } catch (error) {

        console.warn(
            "MODIS no disponible:",
            error
        );

    }


    // -------------------------------------------------
    // GOES
    // -------------------------------------------------

    let goes = [];

    try {

        goes =
            await consultarFIRMS(
                mapKey,
                "GOES_NRT"
            );

    } catch (error) {

        console.warn(
            "GOES no disponible:",
            error
        );

    }


    return {

        fecha,

        viirs,

        modis,

        goes

    };

}


// =====================================================
// CREAR CLUSTERS VIIRS
// =====================================================

function crearClusters(
    detecciones
) {

    const n =
        detecciones.length;

    const visitado =
        new Array(n).fill(false);

    const clusters = [];


    for (
        let i = 0;
        i < n;
        i++
    ) {

        if (visitado[i])
            continue;


        const cluster = [];

        const cola = [i];

        visitado[i] = true;


        while (cola.length) {

            const actual =
                cola.shift();

            cluster.push(
                detecciones[actual]
            );


            for (
                let j = 0;
                j < n;
                j++
            ) {

                if (visitado[j])
                    continue;


                const distancia =
                    distanciaMetros(

                        detecciones[actual]
                        .latitude,

                        detecciones[actual]
                        .longitude,

                        detecciones[j]
                        .latitude,

                        detecciones[j]
                        .longitude

                    );


                if (
                    distancia <=
                    CONFIG.MAX_CLUSTER_DISTANCE_M
                ) {

                    visitado[j] = true;

                    cola.push(j);

                }

            }

        }


        if (
            cluster.length >=
            CONFIG.MIN_CLUSTER_SIZE
        ) {

            clusters.push(
                cluster
            );

        }

    }

    return clusters;

}


// =====================================================
// CENTRO DEL CLUSTER
// =====================================================

function centroCluster(
    cluster
) {

    let lat = 0;
    let lon = 0;

    cluster.forEach(d => {

        lat += d.latitude;
        lon += d.longitude;

    });

    return {

        latitude:
            lat / cluster.length,

        longitude:
            lon / cluster.length

    };

}


// =====================================================
// ESTADÍSTICAS DEL CLUSTER
// =====================================================

function estadisticasCluster(
    cluster
) {

    const centro =
        centroCluster(
            cluster
        );


    let frpTotal = 0;

    let frpMax = 0;

    let t4Max = -Infinity;

    let deltaTMax = -Infinity;

    let radioMax = 0;


    cluster.forEach(d => {

        frpTotal +=
            Number(d.frp) || 0;


        frpMax =
            Math.max(
                frpMax,
                Number(d.frp) || 0
            );


        if (
            Number.isFinite(d.t4)
        ) {

            t4Max =
                Math.max(
                    t4Max,
                    d.t4
                );

        }


        if (
            Number.isFinite(
                d.deltaT
            )
        ) {

            deltaTMax =
                Math.max(
                    deltaTMax,
                    d.deltaT
                );

        }


        const distancia =
            distanciaMetros(

                centro.latitude,
                centro.longitude,

                d.latitude,
                d.longitude

            );


        radioMax =
            Math.max(
                radioMax,
                distancia
            );

    });


    return {

        ...centro,

        size:
            cluster.length,

        frpTotal,

        frpMax,

        t4Max,

        deltaTMax,

        radioMax

    };

}


// =====================================================
// CORROBORACIÓN SENSOR
// =====================================================

function buscarCorroboraciones(
    centro,
    fechaReferencia,
    detecciones
) {

    const cercanas = [];


    detecciones.forEach(d => {

        const distancia =
            distanciaMetros(

                centro.latitude,
                centro.longitude,

                d.latitude,
                d.longitude

            );


        if (
            distancia >
            CONFIG.MAX_CONFIRMATION_DISTANCE_M
        ) {

            return;

        }


        let diferenciaMin = null;


        if (
            fechaReferencia &&
            d.acquisitionDate
        ) {

            diferenciaMin =
                Math.abs(

                    fechaReferencia.getTime() -
                    d.acquisitionDate.getTime()

                ) / 60000;


            if (
                diferenciaMin >
                CONFIG.MAX_CONFIRMATION_TIME_MIN
            ) {

                return;

            }

        }


        cercanas.push({

            deteccion: d,

            distancia,

            diferenciaMin

        });

    });


    cercanas.sort(
        (a, b) =>
            a.distancia -
            b.distancia
    );


    return cercanas;

}


// =====================================================
// CONFIANZA VIIRS
// =====================================================

function puntuacionConfianza(
    confianza
) {

    const c =
        String(
            confianza || ""
        )
        .toLowerCase();


    if (
        c === "h" ||
        c === "high"
    ) {

        return 2;

    }


    if (
        c === "n" ||
        c === "nominal"
    ) {

        return 1;

    }


    if (
        c === "l" ||
        c === "low"
    ) {

        return 0;

    }


    return 0;

}


// =====================================================
// EVALUAR CLUSTER
// =====================================================

function evaluarCluster(
    cluster,
    modis,
    goes
) {

    const stats =
        estadisticasCluster(
            cluster
        );


    const mejorDeteccion =
        [...cluster]
        .sort(
            (a, b) =>
                (b.frp || 0) -
                (a.frp || 0)
        )[0];


    const fechaReferencia =
        mejorDeteccion
        .acquisitionDate;


    const modisCercanos =
        buscarCorroboraciones(

            stats,

            fechaReferencia,

            modis

        );


    const goesCercanos =
        buscarCorroboraciones(

            stats,

            fechaReferencia,

            goes

        );


    let score = 0;


    // -------------------------------------------------
    // TAMAÑO DEL CLUSTER
    // -------------------------------------------------

    if (
        stats.size >= 3
    ) {

        score += 2;

    } else if (
        stats.size >= 2
    ) {

        score += 1;

    }


    // -------------------------------------------------
    // FRP
    // -------------------------------------------------

    if (
        stats.frpMax >=
        CONFIG.MIN_FRP
    ) {

        score += 2;

    }


    // -------------------------------------------------
    // T4
    // -------------------------------------------------

    if (
        stats.t4Max >=
        CONFIG.MIN_T4
    ) {

        score += 1;

    }


    // -------------------------------------------------
    // ΔT
    // -------------------------------------------------

    if (
        stats.deltaTMax >=
        CONFIG.STRONG_DELTA_T
    ) {

        score += 3;

    } else if (
        stats.deltaTMax >=
        CONFIG.MIN_DELTA_T
    ) {

        score += 2;

    }


    // -------------------------------------------------
    // CONFIANZA
    // -------------------------------------------------

    score +=
        Math.max(
            ...cluster.map(
                d =>
                    puntuacionConfianza(
                        d.confidence
                    )
            )
        );


    // -------------------------------------------------
    // MODIS
    // -------------------------------------------------

    if (
        modisCercanos.length > 0
    ) {

        score += 2;

    }


    // -------------------------------------------------
    // GOES
    // -------------------------------------------------

    if (
        goesCercanos.length > 0
    ) {

        score += 2;

    }


    // -------------------------------------------------
    // NIVEL
    // -------------------------------------------------

    let nivel;


    if (
        score >= 8
    ) {

        nivel = "ALTO";

    } else if (
        score >= 5
    ) {

        nivel = "MEDIO";

    } else {

        nivel = "VIGILANCIA";

    }


    return {

        ...stats,

        cluster,

        score,

        nivel,

        modisCercanos,

        goesCercanos,

        confirmado:

            modisCercanos.length > 0 ||
            goesCercanos.length > 0

    };

}


// =====================================================
// COLOR
// =====================================================

function colorNivel(
    nivel
) {

    if (
        nivel === "ALTO"
    )
        return "#ff1744";

    if (
        nivel === "MEDIO"
    )
        return "#ff9100";

    return "#ffeb3b";

}

) {

    const mejor =
        c.cluster
        .slice()
        .sort(
            (a, b) =>
                (b.frp || 0) -
                (a.frp || 0)
        )[0];


    const modis =
        c.modisCercanos.length;

    const goes =
        c.goesCercanos.length;


    return `

        <div style="
            min-width:280px;
            font-family:Arial;
        ">

            <h3 style="
                margin-top:0;
                color:${colorNivel(c.nivel)};
            ">
                🔥 ${c.nivel}
            </h3>

            <b>Score:</b>
            ${c.score}

            <hr>

            <b>Detecciones VIIRS:</b>
            ${c.size}

            <br>

            <b>FRP máximo:</b>
            ${c.frpMax.toFixed(2)}
            MW

            <br>

            <b>FRP total:</b>
            ${c.frpTotal.toFixed(2)}
            MW

            <br>

            <b>T4 máxima:</b>
            ${Number.isFinite(c.t4Max)
                ? c.t4Max.toFixed(2) + " K"
                : "N/D"
            }

            <br>

            <b>ΔT máximo:</b>
            ${Number.isFinite(c.deltaTMax)
                ? c.deltaTMax.toFixed(2) + " K"
                : "N/D"
            }

            <br>

            <b>Radio cluster:</b>
            ${c.radioMax.toFixed(0)}
            m

            <hr>

            <b>MODIS ≤ 3 km:</b>
            ${modis}

            <br>

            <b>GOES ≤ 3 km:</b>
            ${goes}

            <br>

            <b>Corroborado:</b>
            ${
                c.confirmado
                ? "SÍ"
                : "NO"
            }

            <hr>

            <b>Latitud:</b>
            ${c.latitude.toFixed(5)}

            <br>

            <b>Longitud:</b>
            ${c.longitude.toFixed(5)}

            <hr>

            <b>Satélite principal:</b>
            ${mejor.satellite || "N/D"}

            <br>

            <b>Confianza:</b>
            ${mejor.confidence || "N/D"}

            <br>

            <b>Fecha:</b>
            ${mejor.acq_date || "N/D"}

            <br>

            <b>Hora UTC:</b>
            ${mejor.acq_time || "N/D"}

        </div>

    `;

}


// =====================================================
// MOSTRAR CLUSTERS
// =====================================================

function mostrarClusters(
    clusters
) {

    capaClusters.clearLayers();


    clusters.forEach(
        cluster => {

            const color =
                colorNivel(
                    cluster.nivel
                );


            // -----------------------------------------
            // CÍRCULO DE CORROBORACIÓN
            // -----------------------------------------

            L.circle(

                [
                    cluster.latitude,
                    cluster.longitude
                ],

                {

                    radius:
                        CONFIG.MAX_CONFIRMATION_DISTANCE_M,

                    color,

                    weight: 1,

                    opacity: 0.35,

                    fillColor: color,

                    fillOpacity: 0.04

                }

            )
            .bindTooltip(
                `${cluster.nivel} | Score ${cluster.score}`
            )
            .addTo(
                capaClusters
            );


            // -----------------------------------------
            // MARCADOR PRINCIPAL
            // -----------------------------------------

            const radio =
                Math.min(
                    18,
                    7 +
                    cluster.size * 2
                );


            L.circleMarker(

                [
                    cluster.latitude,
                    cluster.longitude
                ],

                {

                    radius,

                    color: "#ffffff",

                    weight: 2,

                    fillColor: color,

                    fillOpacity: 0.9

                }

            )

            .bindPopup(
                popupCluster(
                    cluster
                )
            )

            .addTo(
                capaClusters
            );


            // -----------------------------------------
            // DETECCIONES INDIVIDUALES
            // -----------------------------------------

            cluster.cluster.forEach(
                d => {

                    L.circleMarker(

                        [
                            d.latitude,
                            d.longitude
                        ],

                        {

                            radius: 3,

                            color: "#ffffff",

                            weight: 1,

                            fillColor: color,

                            fillOpacity: 0.65

                        }

                    )

                    .bindTooltip(
                        `${d.satellite || d.sensor} | FRP ${
                            Number(d.frp || 0).toFixed(1)
                        } MW`
                    )

                    .addTo(
                        capaIncendios
                    );

                }
            );

        }
    );

}


// =====================================================
// MOSTRAR DETECCIONES INDIVIDUALES
// =====================================================

function mostrarTodasLasDetecciones(
    datos
) {

    capaIncendios.clearLayers();


    datos.forEach(
        d => {

            const esVIIRS =
                d.sensor
                .startsWith("VIIRS");


            if (!esVIIRS)
                return;


            L.circleMarker(

                [
                    d.latitude,
                    d.longitude
                ],

                {

                    radius: 3,

                    color: "#ffffff",

                    weight: 1,

                    fillColor: "#00e5ff",

                    fillOpacity: 0.55

                }

            )

            .bindTooltip(

                `${d.sensor}<br>` +

                `FRP: ${
                    Number(
                        d.frp || 0
                    ).toFixed(2)
                } MW<br>` +

                `T4: ${
                    Number.isFinite(d.t4)
                    ? d.t4.toFixed(2)
                    : "N/D"
                } K<br>` +

                `T5: ${
                    Number.isFinite(d.t5)
                    ? d.t5.toFixed(2)
                    : "N/D"
                } K<br>` +

                `ΔT: ${
                    Number.isFinite(d.deltaT)
                    ? d.deltaT.toFixed(2)
                    : "N/D"
                } K`

            )

            .addTo(
                capaIncendios
            );

        }
    );

}


// =====================================================
// ACTUALIZAR ESTADÍSTICAS
// =====================================================

function actualizarEstadisticas(
    datos,
    clusters
) {

    const alto =
        clusters.filter(
            c =>
                c.nivel === "ALTO"
        ).length;


    const medio =
        clusters.filter(
            c =>
                c.nivel === "MEDIO"
        ).length;


    const vigilancia =
        clusters.filter(
            c =>
                c.nivel === "VIGILANCIA"
        ).length;


    document
        .getElementById(
            "statVIIRS"
        )
        .textContent =
            datos.viirs.length;


    document
        .getElementById(
            "statClusters"
        )
        .textContent =
            clusters.length;


    document
        .getElementById(
            "statAlto"
        )
        .textContent =
            alto;


    document
        .getElementById(
            "statMedio"
        )
        .textContent =
            medio;


    document
        .getElementById(
            "statVigilancia"
        )
        .textContent =
            vigilancia;


    document
        .getElementById(
            "statMODIS"
        )
        .textContent =
            datos.modis.length;


    document
        .getElementById(
            "statGOES"
        )
        .textContent =
            datos.goes.length;

}


// =====================================================
// ESTADO
// =====================================================

function actualizarEstado(
    texto
) {

    document
        .getElementById(
            "estado"
        )
        .textContent =
            texto;

}


// =====================================================
// ACTUALIZACIÓN PRINCIPAL
// =====================================================

let actualizando = false;


async function actualizarIncendios() {

    if (actualizando) {

        console.warn(
            "Ya existe una actualización en curso."
        );

        return;

    }


    actualizando = true;


    try {

        actualizarEstado(
            "Consultando FIRMS..."
        );


        const datos =
            await descargarDatos();


        console.log(
            "VIIRS:",
            datos.viirs
        );


        console.log(
            "MODIS:",
            datos.modis
        );


        console.log(
            "GOES:",
            datos.goes
        );


        // ---------------------------------------------
        // CREAR CLUSTERS
        // ---------------------------------------------

        const clustersBase =
            crearClusters(
                datos.viirs
            );


        // ---------------------------------------------
        // EVALUAR
        // ---------------------------------------------

        const clusters =
            clustersBase.map(
                cluster =>
                    evaluarCluster(
                        cluster,
                        datos.modis,
                        datos.goes
                    )
            );


        // ---------------------------------------------
        // MOSTRAR
        // ---------------------------------------------

        mostrarTodasLasDetecciones(
            datos
        );


        mostrarClusters(
            clusters
        );


        actualizarEstadisticas(
            datos,
            clusters
        );


        // ---------------------------------------------
        // ESTADO
        // ---------------------------------------------

        const fecha =
            obtenerFechaPeru();


        const hora =
            new Intl.DateTimeFormat(
                "es-PE",
                {

                    timeZone:
                        "America/Lima",

                    hour: "2-digit",

                    minute: "2-digit",

                    second: "2-digit"

                }

            ).format(
                new Date()
            );


        actualizarEstado(

            `Actualizado: ${fecha} ${hora} | ` +
            `VIIRS: ${datos.viirs.length} | ` +
            `Clusters: ${clusters.length}`

        );


        document
            .getElementById(
                "ultimaActualizacion"
            )
            .textContent =
                `Última actualización: ${fecha} ${hora} hora Perú`;


        // ---------------------------------------------
        // CONSOLA
        // ---------------------------------------------

        console.log(
            "===================================="
        );

        console.log(
            "MONITOREO FIRMS - PERÚ"
        );

        console.log(
            "Fecha:",
            fecha
        );

        console.log(
            "VIIRS:",
            datos.viirs.length
        );

        console.log(
            "MODIS:",
            datos.modis.length
        );

        console.log(
            "GOES:",
            datos.goes.length
        );

        console.log(
            "Clusters:",
            clusters.length
        );

        console.log(
            "===================================="
        );


        // ---------------------------------------------
        // GUARDAR PARA DEBUG
        // ---------------------------------------------

        window.ultimosDatos = datos;

        window.ultimosClusters =
            clusters;


    } catch (error) {

        console.error(
            "ERROR FIRMS:",
            error
        );


        actualizarEstado(
            "❌ Error: " +
            error.message
        );

    } finally {

        actualizando =
            false;

    }

}


// =====================================================
// GUARDAR MAP KEY
// =====================================================

function guardarYActualizar() {

    const key =
        document
        .getElementById(
            "mapKey"
        )
        .value
        .trim();


    if (!key) {

        alert(
            "Introduce tu FIRMS MAP_KEY."
        );

        return;

    }


    localStorage.setItem(
        "firms_map_key",
        key
    );


    actualizarIncendios();

}


// =====================================================
// RECUPERAR MAP KEY
// =====================================================

const savedKey =
    localStorage.getItem(
        "firms_map_key"
    );


if (savedKey) {

    document
        .getElementById(
            "mapKey"
        )
        .value =
            savedKey;

}


// =====================================================
// ACTUALIZACIÓN AUTOMÁTICA
// =====================================================

setInterval(

    async () => {

        await actualizarIncendios();

    },

    CONFIG.INTERVALO

);


// =====================================================
// INICIO
// =====================================================

window.addEventListener(
    "load",
    () => {

        const key =
            document
            .getElementById(
                "mapKey"
            )
            .value
            .trim();


        if (key) {

            actualizarIncendios();

        } else {

            actualizarEstado(
                "Introduzca su FIRMS MAP_KEY."
            );

        }

    }
);

</script>
