<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitor de Incendios — Perú</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#071018;
  color:#eaf2f7;
}

body{
  overflow:hidden;
}

/* =========================
   CABECERA
========================= */

#header{
  height:64px;
  background:#101c25;
  border-bottom:1px solid #263845;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:relative;
  z-index:1000;
}

#title{
  font-size:20px;
  font-weight:bold;
}

#status{
  font-size:13px;
  color:#8fc7e8;
}

/* =========================
   CONTENEDOR
========================= */

#app{
  height:calc(100vh - 64px);
  display:flex;
}

/* =========================
   PANEL
========================= */

#sidebar{
  width:400px;
  min-width:400px;
  height:100%;
  overflow-y:auto;
  background:#09131b;
  border-right:1px solid #263845;
  padding:14px;
  position:relative;
  z-index:900;
}

.section{
  margin-bottom:18px;
}

.section-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

label{
  display:block;
  font-size:12px;
  color:#9fb2bd;
  margin:7px 0 5px;
}

input,
select,
button{
  width:100%;
  border-radius:5px;
  border:1px solid #304754;
  background:#0d1a23;
  color:white;
  padding:9px 10px;
  font-size:14px;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2785d9;
}

button{
  cursor:pointer;
  font-weight:bold;
  margin-top:6px;
}

button:hover{
  filter:brightness(1.12);
}

.btn-blue{
  background:#176cc1;
}

.btn-green{
  background:#07885f;
}

.btn-gray{
  background:#455b67;
}

.btn-red{
  background:#8d253d;
}

.btn-purple{
  background:#653f9b;
}

/* =========================
   CAPAS
========================= */

.layer-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border:1px solid #293c48;
  border-radius:5px;
  margin-bottom:6px;
  background:#0d1a23;
}

.layer-item input{
  width:auto;
  margin:0;
}

.layer-symbol{
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hotspot-symbol{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#8d1745;
  border:2px solid #f2a4bd;
}

.fire-symbol{
  font-size:17px;
}

/* =========================
   RESULTADOS
========================= */

#results{
  background:#071018;
  border:1px solid #293c48;
  border-radius:5px;
  padding:9px;
  max-height:310px;
  overflow:auto;
  font-size:12px;
}

.result-card{
  border-bottom:1px solid #293c48;
  padding:8px 2px;
}

.result-card:last-child{
  border-bottom:none;
}

.result-title{
  font-weight:bold;
  color:#7fc8f0;
  margin-bottom:4px;
}

.result-row{
  margin:2px 0;
}

.badge{
  display:inline-block;
  padding:2px 5px;
  border-radius:4px;
  background:#253844;
  margin-right:3px;
}

.badge-confirmado{
  background:#8d1745;
}

.badge-alertado{
  background:#c27800;
}

.badge-controlado{
  background:#167b4d;
}

/* =========================
   MAPA
========================= */

#map{
  flex:1;
  height:100%;
  background:#071018;
}

/* =========================
   MARCADORES
========================= */

.hotspot-marker{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#8d1745;
  border:2px solid #ffd1df;
  box-shadow:
    0 0 0 2px rgba(141,23,69,.25),
    0 0 10px rgba(141,23,69,.9);
}

.fire-marker{
  font-size:26px;
  line-height:26px;
  text-shadow:
    0 0 4px white,
    0 0 8px #ff4500;
}

/* =========================
   LEYENDA
========================= */

.legend{
  background:rgba(7,16,24,.92);
  color:white;
  padding:9px 11px;
  border-radius:6px;
  border:1px solid #304754;
  font-size:12px;
  line-height:20px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:7px;
}

/* =========================
   MENSAJE
========================= */

#message{
  padding:8px;
  background:#111f28;
  border:1px solid #293c48;
  border-radius:5px;
  font-size:12px;
  color:#a9c0cb;
  margin-top:8px;
}

.success{
  color:#63d39b !important;
}

.warning{
  color:#ffc86b !important;
}

.error{
  color:#ff7f8d !important;
}

</style>
</head>

<body>

<!-- =========================================================
     CABECERA
========================================================= -->

<div id="header">

  <div id="title">
    🔥 MONITOR DE INCENDIOS — PERÚ
  </div>

  <div id="status">
    Inicializando...
  </div>

</div>


<!-- =========================================================
     APLICACIÓN
========================================================= -->

<div id="app">

  <!-- =======================================================
       SIDEBAR
  ======================================================== -->

  <aside id="sidebar">

    <div class="section">

      <div class="section-title">
        Configuración y resultados
      </div>

      <!-- MAP KEY -->

      <label for="mapKey">
        FIRMS MAP KEY
      </label>

      <input
        id="mapKey"
        type="password"
        placeholder="Ingrese su MAP_KEY de NASA FIRMS"
      >

      <div style="font-size:11px;color:#8198a5;margin-top:5px;">
        La MAP_KEY se almacena únicamente en este navegador.
      </div>

      <button
        id="saveKey"
        class="btn-blue"
      >
        💾 Guardar MAP_KEY
      </button>

    </div>


    <!-- =====================================================
         COORDENADAS
    ====================================================== -->

    <div class="section">

      <div class="section-title">
        📍 Ir a coordenadas
      </div>

      <label for="latInput">
        Latitud
      </label>

      <input
        id="latInput"
        type="number"
        step="0.000001"
        placeholder="Ej. -9.190000"
      >

      <label for="lonInput">
        Longitud
      </label>

      <input
        id="lonInput"
        type="number"
        step="0.000001"
        placeholder="Ej. -75.015200"
      >

      <button
        id="goCoordinate"
        class="btn-blue"
      >
        📍 Ir a la coordenada
      </button>

      <button
        id="addPoint"
        class="btn-green"
      >
        ➕ Agregar punto
      </button>

      <button
        id="clearPoint"
        class="btn-gray"
      >
        🧹 Limpiar punto
      </button>

    </div>


    <!-- =====================================================
         CAPAS OPERATIVAS
    ====================================================== -->

    <div class="section">

      <div class="section-title">
        🛰️ Capas operativas opcionales
      </div>

      <!-- FOCOS SERFOR -->

      <div class="layer-item">

        <input
          type="checkbox"
          id="chkSerforHotspots"
        >

        <div class="layer-symbol">
          <div class="hotspot-symbol"></div>
        </div>

        <label
          for="chkSerforHotspots"
          style="margin:0;flex:1;"
        >
          Focos de calor SERFOR
        </label>

      </div>


      <!-- INCENDIOS SERFOR -->

      <div class="layer-item">

        <input
          type="checkbox"
          id="chkSerforFires"
        >

        <div class="layer-symbol">
          <div class="fire-symbol">🔥</div>
        </div>

        <label
          for="chkSerforFires"
          style="margin:0;flex:1;"
        >
          Incendio Forestal SERFOR
        </label>

      </div>


      <!-- FIRMS S-NPP -->

      <div class="layer-item">

        <input
          type="checkbox"
          id="chkSNPP"
        >

        <div class="layer-symbol">
          <div class="hotspot-symbol"></div>
        </div>

        <label
          for="chkSNPP"
          style="margin:0;flex:1;"
        >
          VIIRS Suomi-NPP — FIRMS
        </label>

      </div>


      <!-- FIRMS NOAA20 -->

      <div class="layer-item">

        <input
          type="checkbox"
          id="chkNOAA20"
        >

        <div class="layer-symbol">
          <div class="hotspot-symbol"></div>
        </div>

        <label
          for="chkNOAA20"
          style="margin:0;flex:1;"
        >
          VIIRS NOAA-20 — FIRMS
        </label>

      </div>


      <!-- FIRMS NOAA21 -->

      <div class="layer-item">

        <input
          type="checkbox"
          id="chkNOAA21"
        >

        <div class="layer-symbol">
          <div class="hotspot-symbol"></div>
        </div>

        <label
          for="chkNOAA21"
          style="margin:0;flex:1;"
        >
          VIIRS NOAA-21 — FIRMS
        </label>

      </div>


      <button
        id="loadFirms"
        class="btn-purple"
      >
        🛰️ Actualizar focos FIRMS
      </button>

    </div>


    <!-- =====================================================
         CONSULTA
    ====================================================== -->

    <div class="section">

      <div class="section-title">
        🔎 Consulta operativa
      </div>

      <button
        id="queryMap"
        class="btn-blue"
      >
        🔎 Consultar focos e incendios en la vista
      </button>

      <button
        id="clearResults"
        class="btn-gray"
      >
        🧹 Limpiar resultados
      </button>

      <div id="message">
        Listo.
      </div>

    </div>


    <!-- =====================================================
         RESULTADOS
    ====================================================== -->

    <div class="section">

      <div class="section-title">
        Resultados
      </div>

      <div id="results">
        Haga clic sobre un punto o utilice
        "Consultar focos e incendios en la vista".
      </div>

    </div>

  </aside>


  <!-- =======================================================
       MAPA
  ======================================================== -->

  <main id="map"></main>

</div>


<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ==========================================================
   ESPERAR A QUE EL DOM ESTÉ COMPLETO
   Esto evita:
   Cannot set properties of null (setting 'textContent')
========================================================== */

document.addEventListener("DOMContentLoaded", function(){

"use strict";


/* ==========================================================
   CONFIGURACIÓN
========================================================== */

const PERU_CENTER = [-9.19, -75.015];

const SERFOR_WMS =
"https://geo.serfor.gob.pe/geoservicios/services/Servicios_OGC/Unidad_Monitoreo_Satelital/MapServer/WMSServer";

const SERFOR_REST =
"https://geo.serfor.gob.pe/geoservicios/rest/services/Servicios_OGC/Unidad_Monitoreo_Satelital/MapServer";

const SERFOR_HOTSPOT =
SERFOR_REST + "/0";

const SERFOR_FIRE =
SERFOR_REST + "/1";

const FIRMS_API =
"https://firms.modaps.eosdis.nasa.gov/api/area/csv";


/* ==========================================================
   ELEMENTOS
========================================================== */

const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");
const resultsEl = document.getElementById("results");

const mapKeyEl = document.getElementById("mapKey");

const latEl = document.getElementById("latInput");
const lonEl = document.getElementById("lonInput");

const chkSerforHotspots =
document.getElementById("chkSerforHotspots");

const chkSerforFires =
document.getElementById("chkSerforFires");

const chkSNPP =
document.getElementById("chkSNPP");

const chkNOAA20 =
document.getElementById("chkNOAA20");

const chkNOAA21 =
document.getElementById("chkNOAA21");


/* ==========================================================
   MAPA
========================================================== */

const map = L.map("map", {

  center: PERU_CENTER,

  zoom: 5,

  zoomControl: true,

  preferCanvas: true

});


/* ==========================================================
   MAPAS BASE
========================================================== */

const imagery = L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
{
  maxZoom: 18,
  attribution:
  "© Esri, Maxar, Earthstar Geographics"
}
).addTo(map);


const osm = L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
  maxZoom: 19,
  attribution:
  "© OpenStreetMap contributors"
}
);


/* ==========================================================
   CONTROL DE MAPAS
========================================================== */

L.control.layers(
{
  "🛰️ Imagen satelital": imagery,
  "🗺️ OpenStreetMap": osm
},
{},
{
  collapsed:true
}
).addTo(map);


/* ==========================================================
   CAPAS
========================================================== */

let serforHotspotLayer = null;
let serforFireLayer = null;

let firmsSNPP = L.layerGroup();
let firmsNOAA20 = L.layerGroup();
let firmsNOAA21 = L.layerGroup();

let coordinateMarker = null;


/* ==========================================================
   WMS SERFOR
========================================================== */

serforHotspotLayer = L.tileLayer.wms(
SERFOR_WMS,
{
  layers:"0",
  format:"image/png",
  transparent:true,
  version:"1.3.0",
  opacity:0.95
});


serforFireLayer = L.tileLayer.wms(
SERFOR_WMS,
{
  layers:"1",
  format:"image/png",
  transparent:true,
  version:"1.3.0",
  opacity:0.95
});


/* ==========================================================
   ICONOS
========================================================== */

const hotspotIcon =
L.divIcon({
  className:"",
  html:'<div class="hotspot-marker"></div>',
  iconSize:[14,14],
  iconAnchor:[7,7]
});


const fireIcon =
L.divIcon({
  className:"",
  html:'<div class="fire-marker">🔥</div>',
  iconSize:[28,28],
  iconAnchor:[14,25]
});


/* ==========================================================
   FUNCIONES AUXILIARES
========================================================== */

function setStatus(text){

  if(statusEl){

    statusEl.textContent = text;

  }

}


function setMessage(text, type){

  if(!messageEl) return;

  messageEl.textContent = text;

  messageEl.className = "";

  if(type){

    messageEl.classList.add(type);

  }

}


function escapeHtml(value){

  if(value === null || value === undefined){

    return "";

  }

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* ==========================================================
   MAP KEY
========================================================== */

const savedKey =
localStorage.getItem("FIRMS_MAP_KEY");

if(savedKey){

  mapKeyEl.value = savedKey;

}


document.getElementById("saveKey")
.addEventListener("click",function(){

  const key =
  mapKeyEl.value.trim();

  if(!key){

    setMessage(
      "Ingrese una MAP_KEY válida.",
      "warning"
    );

    return;

  }

  localStorage.setItem(
    "FIRMS_MAP_KEY",
    key
  );

  setMessage(
    "MAP_KEY guardada correctamente.",
    "success"
  );

});


/* ==========================================================
   CAPAS SERFOR
========================================================== */

chkSerforHotspots
.addEventListener("change",function(){

  if(this.checked){

    serforHotspotLayer.addTo(map);

  }else{

    map.removeLayer(
      serforHotspotLayer
    );

  }

});


chkSerforFires
.addEventListener("change",function(){

  if(this.checked){

    serforFireLayer.addTo(map);

  }else{

    map.removeLayer(
      serforFireLayer
    );

  }

});


/* ==========================================================
   FIRMS WMS / DATOS
========================================================== */

function getPeruBBox(){

  const b = map.getBounds();

  const west =
  b.getWest();

  const south =
  b.getSouth();

  const east =
  b.getEast();

  const north =
  b.getNorth();

  return [
    west,
    south,
    east,
    north
  ].join(",");

}


/* ==========================================================
   CONSULTA FIRMS CSV
========================================================== */

async function getFirmsData(
  satellite
){

  const key =
  mapKeyEl.value.trim();

  if(!key){

    throw new Error(
      "No se ha ingresado la FIRMS MAP_KEY."
    );

  }

  const bbox =
  getPeruBBox();

  const url =
    FIRMS_API +
    "/" +
    encodeURIComponent(key) +
    "/" +
    satellite +
    "/" +
    encodeURIComponent(bbox) +
    "/1";


  const response =
  await fetch(url);


  if(!response.ok){

    throw new Error(
      "FIRMS respondió HTTP " +
      response.status
    );

  }


  const text =
  await response.text();


  if(
    text.includes("Invalid MAP_KEY") ||
    text.includes("Error")
  ){

    throw new Error(
      text.substring(0,300)
    );

  }


  return parseCSV(text);

}


/* ==========================================================
   CSV
========================================================== */

function parseCSV(text){

  const lines =
  text.trim().split(/\r?\n/);

  if(lines.length < 2){

    return [];

  }

  const headers =
  lines[0].split(",").map(
    h => h.trim()
  );

  const records = [];

  for(let i=1;i<lines.length;i++){

    const row =
    lines[i].split(",");

    const obj = {};

    headers.forEach(
      (header,index)=>{

        obj[header] =
        row[index] !== undefined
        ? row[index]
        : "";

      }
    );

    records.push(obj);

  }

  return records;

}


/* ==========================================================
   CARGAR FIRMS
========================================================== */

async function loadFirms(){

  const key =
  mapKeyEl.value.trim();

  if(!key){

    setMessage(
      "Ingrese primero la FIRMS MAP_KEY.",
      "warning"
    );

    return;

  }


  setMessage(
    "Consultando VIIRS Suomi-NPP, NOAA-20 y NOAA-21...",
    ""
  );


  firmsSNPP.clearLayers();

  firmsNOAA20.clearLayers();

  firmsNOAA21.clearLayers();


  try{

    const requests = [];


    if(chkSNPP.checked){

      requests.push({

        name:"Suomi-NPP",

        source:"VIIRS_SNPP_NRT",

        group:firmsSNPP

      });

    }


    if(chkNOAA20.checked){

      requests.push({

        name:"NOAA-20",

        source:"VIIRS_NOAA20_NRT",

        group:firmsNOAA20

      });

    }


    if(chkNOAA21.checked){

      requests.push({

        name:"NOAA-21",

        source:"VIIRS_NOAA21_NRT",

        group:firmsNOAA21

      });

    }


    if(requests.length === 0){

      setMessage(
        "Seleccione al menos un satélite FIRMS.",
        "warning"
      );

      return;

    }


    let total = 0;


    for(const req of requests){

      try{

        const data =
        await getFirmsData(
          req.source
        );


        data.forEach(
          point => {

            const lat =
            parseFloat(point.latitude);

            const lon =
            parseFloat(point.longitude);


            if(
              !Number.isFinite(lat) ||
              !Number.isFinite(lon)
            ){

              return;

            }


            const marker =
            L.marker(
              [lat,lon],
              {
                icon:hotspotIcon
              }
            );


            marker.bindPopup(

              "<b>🔥 Foco de calor FIRMS</b>" +

              "<br><b>Satélite:</b> " +
              escapeHtml(req.name) +

              "<br><b>Fecha:</b> " +
              escapeHtml(point.acq_date) +

              "<br><b>Hora:</b> " +
              escapeHtml(point.acq_time) +

              "<br><b>Latitud:</b> " +
              lat.toFixed(6) +

              "<br><b>Longitud:</b> " +
              lon.toFixed(6) +

              "<br><b>FRP:</b> " +
              escapeHtml(point.frp) +

              "<br><b>Confianza:</b> " +
              escapeHtml(point.confidence)

            );


            marker.addTo(
              req.group
            );


            total++;

          }
        );


        if(
          req.group.getLayers().length > 0
        ){

          req.group.addTo(map);

        }

      }
      catch(err){

        console.error(
          req.name,
          err
        );

      }

    }


    setMessage(
      "FIRMS actualizado: " +
      total +
      " focos.",
      "success"
    );


    setStatus(
      "✓ FIRMS — " +
      total +
      " focos"
    );

  }
  catch(error){

    console.error(error);

    setMessage(
      "Error FIRMS: " +
      error.message,
      "error"
    );

  }

}


/* ==========================================================
   BOTÓN FIRMS
========================================================== */

document.getElementById("loadFirms")
.addEventListener(
  "click",
  loadFirms
);


/* ==========================================================
   IR A COORDENADA
========================================================== */

document.getElementById("goCoordinate")
.addEventListener(
"click",
function(){

  const lat =
  parseFloat(latEl.value);

  const lon =
  parseFloat(lonEl.value);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){

    setMessage(
      "Ingrese latitud y longitud válidas.",
      "warning"
    );

    return;

  }


  if(
    lat < -90 ||
    lat > 90 ||
    lon < -180 ||
    lon > 180
  ){

    setMessage(
      "Las coordenadas están fuera de rango.",
      "warning"
    );

    return;

  }


  map.setView(
    [lat,lon],
    11,
    {
      animate:true
    }
  );


  if(coordinateMarker){

    map.removeLayer(
      coordinateMarker
    );

  }


  coordinateMarker =
  L.marker(
    [lat,lon]
  ).addTo(map);


  coordinateMarker.bindPopup(

    "<b>📍 Coordenada seleccionada</b>" +

    "<br>Latitud: " +
    lat.toFixed(6) +

    "<br>Longitud: " +
    lon.toFixed(6)

  ).openPopup();


  setMessage(
    "Vista centrada en " +
    lat.toFixed(6) +
    ", " +
    lon.toFixed(6),
    "success"
  );

});


/* ==========================================================
   AGREGAR PUNTO
========================================================== */

document.getElementById("addPoint")
.addEventListener(
"click",
function(){

  const lat =
  parseFloat(latEl.value);

  const lon =
  parseFloat(lonEl.value);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){

    setMessage(
      "Ingrese primero las coordenadas.",
      "warning"
    );

    return;

  }


  if(coordinateMarker){

    map.removeLayer(
      coordinateMarker
    );

  }


  coordinateMarker =
  L.marker(
    [lat,lon]
  ).addTo(map);


  coordinateMarker.bindPopup(

    "<b>📍 Punto de interés</b>" +

    "<br>Latitud: " +
    lat.toFixed(6) +

    "<br>Longitud: " +
    lon.toFixed(6)

  ).openPopup();


  map.setView(
    [lat,lon],
    11
  );


  setMessage(
    "Punto agregado correctamente.",
    "success"
  );

});

document.getElementById("clearPoint")

/* ==========================================================
   CONSULTA ARC GIS SERFOR
========================================================== */

async function querySerforLayer(
  layerUrl,
  lat,
  lon,
  distanceKm
){

  const params = new URLSearchParams({

    where:"1=1",

    geometry:
      lon + "," + lat,

    geometryType:
      "esriGeometryPoint",

    inSR:"4326",

    spatialRel:
      "esriSpatialRelIntersects",

    distance:
      String(distanceKm),

    units:
      "esriSRUnit_Kilometer",

    outFields:"*",

    returnGeometry:"true",

    outSR:"4326",

    f:"geojson"

  });


  const url =
    layerUrl +
    "/query?" +
    params.toString();


  const response =
  await fetch(url);


  if(!response.ok){

    throw new Error(
      "SERFOR HTTP " +
      response.status
    );

  }


  const json =
  await response.json();


  return json.features || [];

}


/* ==========================================================
   POPUP DE ATRIBUTOS SERFOR
========================================================== */

function createSerforPopup(
  feature,
  type
){

  const p =
  feature.properties || {};


  let html =

    "<div style='max-width:320px'>" +

    "<b>" +
    (
      type === "foco"
      ? "● Foco de calor SERFOR"
      : "🔥 Incendio Forestal SERFOR"
    ) +
    "</b>" +


    "<hr style='border:0;border-top:1px solid #ddd'>";


  const fields = [

    ["Fuente","FUENTE"],

    ["Fecha satélite","FECHA"],

    ["Hora","HORA"],

    ["Departamento","NOMDEP"],

    ["Provincia","NOMPRO"],

    ["Distrito","NOMDIS"],

    ["Cobertura","TIPCOB"],

    ["Satélite","SENSAT"],

    ["Nivel de peligro","PELIGRO"],

    ["Estado","ESTADO"],

    ["Código reporte","CODREP"],

    ["Observación","OBSERV"]

  ];


  fields.forEach(
    item => {

      const label =
      item[0];

      const field =
      item[1];

      if(
        p[field] !== undefined &&
        p[field] !== null &&
        p[field] !== ""
      ){

        html +=

          "<div style='margin:3px 0'>" +

          "<b>" +
          escapeHtml(label) +
          ":</b> " +

          escapeHtml(p[field]) +

          "</div>";

      }

    }
  );


  html += "</div>";


  return html;

}


/* ==========================================================
   CONSULTAR UN PUNTO
========================================================== */

async function queryPoint(
  lat,
  lon
){

  setMessage(
    "Consultando SERFOR alrededor del punto...",
    ""
  );


  resultsEl.innerHTML =
  "Consultando...";


  try{

    const [
      hotspots,
      fires
    ] =
    await Promise.all([

      querySerforLayer(
        SERFOR_HOTSPOT,
        lat,
        lon,
        10
      ),

      querySerforLayer(
        SERFOR_FIRE,
        lat,
        lon,
        10
      )

    ]);


    renderResults(
      hotspots,
      fires,
      lat,
      lon
    );


    setMessage(
      "Consulta completada: " +
      hotspots.length +
      " focos + " +
      fires.length +
      " incendios.",
      "success"
    );


  }
  catch(error){

    console.error(error);

    resultsEl.innerHTML =
      "<div class='error'>" +
      escapeHtml(error.message) +
      "</div>";


    setMessage(
      "Error consultando SERFOR.",
      "error"
    );

  }

}


/* ==========================================================
   RENDER RESULTADOS
========================================================== */

function renderResults(
  hotspots,
  fires,
  lat,
  lon
){

  let html = "";


  html +=

    "<div class='result-card'>" +

    "<div class='result-title'>" +
    "📍 Punto consultado" +
    "</div>" +

    "<div class='result-row'>" +
    "Latitud: " +
    lat.toFixed(6) +
    "</div>" +

    "<div class='result-row'>" +
    "Longitud: " +
    lon.toFixed(6) +
    "</div>" +

    "<div class='result-row'>" +
    "Radio: 10 km" +
    "</div>" +

    "</div>";


  html +=

    "<div class='result-card'>" +

    "<div class='result-title'>" +
    "● Focos de calor SERFOR (" +
    hotspots.length +
    ")" +
    "</div>";


  if(hotspots.length === 0){

    html +=
      "No se encontraron focos.";

  }
  else{

    hotspots
    .slice(0,50)
    .forEach(
      (feature,index)=>{

        const p =
        feature.properties || {};


        html +=

          "<div class='result-row'>" +

          "<b>" +
          (index+1) +
          ".</b> " +

          escapeHtml(
            p.NOMDEP || ""
          ) +

          " / " +

          escapeHtml(
            p.NOMDIS || ""
          ) +

          "<br>" +

          "Satélite: " +

          escapeHtml(
            p.SENSAT || ""
          ) +

          " | Fecha: " +

          escapeHtml(
            p.FECHA || ""
          ) +

          "</div>";

      }
    );

  }


  html += "</div>";


  html +=

    "<div class='result-card'>" +

    "<div class='result-title'>" +

    "🔥 Incendios Forestales SERFOR (" +

    fires.length +

    ")" +

    "</div>";


  if(fires.length === 0){

    html +=
      "No se encontraron incendios.";

  }
  else{

    fires
    .slice(0,50)
    .forEach(
      (feature,index)=>{

        const p =
        feature.properties || {};


        let estado =
        p.ESTADO;


        let estadoText =
        "Estado " + estado;


        if(estado === 1){

          estadoText =
          "Alertado";

        }

        if(estado === 2){

          estadoText =
          "Confirmado";

        }

        if(estado === 3){

          estadoText =
          "Controlado";

        }

        if(estado === 4){

          estadoText =
          "Liquidado";

        }


        html +=

          "<div class='result-row'>" +

          "<b>" +
          (index+1) +
          ".</b> " +

          escapeHtml(
            p.NOMDEP || ""
          ) +

          " / " +

          escapeHtml(
            p.NOMDIS || ""
          ) +

          "<br>" +

          "<span class='badge'>" +

          escapeHtml(
            estadoText
          ) +

          "</span>" +

          " " +

          "Satélite: " +

          escapeHtml(
            p.SENSAT || ""
          ) +

          "</div>";

      }
    );

  }


  html += "</div>";


  resultsEl.innerHTML =
  html;


  /* ========================================================
     AGREGAR RESULTADOS AL MAPA
  ====================================================== */


  hotspots.forEach(
    feature => {

      if(
        !feature.geometry ||
        !feature.geometry.coordinates
      ){

        return;

      }


      const [
        lon,
        lat
      ] =
      feature.geometry.coordinates;


      const marker =
      L.marker(
        [lat,lon],
        {
          icon:hotspotIcon
        }
      );


      marker.bindPopup(
        createSerforPopup(
          feature,
          "foco"
        )
      );


      marker.addTo(map);

    }
  );


  fires.forEach(
    feature => {

      if(
        !feature.geometry ||
        !feature.geometry.coordinates
      ){

        return;

      }


      const [
        lon,
        lat
      ] =
      feature.geometry.coordinates;


      const marker =
      L.marker(
        [lat,lon],
        {
          icon:fireIcon
        }
      );


      marker.bindPopup(
        createSerforPopup(
          feature,
          "incendio"
        )
      );


      marker.addTo(map);

    }
  );

}


/* ==========================================================
   CONSULTAR PUNTO AL HACER CLIC
========================================================== */

map.on(
"click",
function(e){

  const lat =
  e.latlng.lat;

  const lon =
  e.latlng.lng;


  latEl.value =
  lat.toFixed(6);

  lonEl.value =
  lon.toFixed(6);


  if(coordinateMarker){

    map.removeLayer(
      coordinateMarker
    );

  }


  coordinateMarker =
  L.marker(
    [lat,lon]
  ).addTo(map);


  coordinateMarker.bindPopup(

    "<b>📍 Punto de consulta</b>" +

    "<br>Lat: " +
    lat.toFixed(6) +

    "<br>Lon: " +
    lon.toFixed(6) +

    "<br><br>" +

    "Consultando SERFOR..."

  ).openPopup();


  queryPoint(
    lat,
    lon
  );

});
