<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fire Monitor Perú</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* =========================
       ENCABEZADO
       ========================= */

    .header {
      position: absolute;
      z-index: 2000;
      top: 0;
      left: 0;
      right: 0;

      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: rgba(15, 23, 42, 0.96);

      border-bottom: 1px solid #374151;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .title span {
      color: #f97316;
    }

    .subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    /* =========================
       PANEL
       ========================= */

    .panel {
      position: absolute;
      z-index: 2000;

      top: 82px;
      left: 18px;

      width: 340px;

      padding: 17px;

      background: rgba(15, 23, 42, 0.97);

      border: 1px solid #374151;

      border-radius: 12px;

      box-shadow: 0 10px 35px rgba(0,0,0,.45);

      max-height: calc(100vh - 100px);

      overflow-y: auto;
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 17px;
    }

    /* =========================
       INPUT
       ========================= */

    label.input-label {
      display: block;

      margin-top: 10px;
      margin-bottom: 5px;

      font-size: 12px;

      color: #d1d5db;
    }

    input[type="password"] {
      width: 100%;

      padding: 10px;

      background: #1f2937;

      color: white;

      border: 1px solid #4b5563;

      border-radius: 7px;

      outline: none;
    }

    input[type="password"]:focus {
      border-color: #f97316;
    }

    /* =========================
       BOTONES
       ========================= */

    button {
      width: 100%;

      margin-top: 10px;

      padding: 10px;

      border: none;

      border-radius: 7px;

      background: #ea580c;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #f97316;
    }

    /* =========================
       ESTADO
       ========================= */

    .status {
      margin-top: 12px;

      padding: 9px;

      border-radius: 7px;

      background: #1f2937;

      font-size: 12px;

      color: #d1d5db;
    }

    /* =========================
       ESTADÍSTICAS
       ========================= */

    .stats {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 7px;

      margin-top: 12px;
    }

    .stat {
      padding: 9px;

      background: #1f2937;

      border-radius: 7px;

      text-align: center;
    }

    .stat-number {
      font-size: 18px;

      font-weight: bold;

      color: #fb923c;
    }

    .stat-label {
      font-size: 10px;

      color: #9ca3af;
    }

    /* =========================
       CAPAS
       ========================= */

    .layers {
      margin-top: 15px;

      padding-top: 12px;

      border-top: 1px solid #374151;

      font-size: 12px;
    }

    .layers-title {
      margin-bottom: 8px;

      font-size: 13px;

      font-weight: bold;

      color: #f3f4f6;
    }

    .check {
      display: flex;

      align-items: center;

      gap: 8px;

      margin: 8px 0;

      cursor: pointer;

      color: #d1d5db;
    }

    .check:hover {
      color: #fb923c;
    }

    .check input[type="checkbox"] {
      width: auto;

      margin: 0;

      cursor: pointer;

      accent-color: #f97316;
    }

    /* =========================
       COLORES SATÉLITES
       ========================= */

    .dot {
      display: inline-block;

      width: 11px;
      height: 11px;

      border-radius: 50%;

      flex-shrink: 0;
    }

    .noaa20 {
      background: #38bdf8;

      box-shadow: 0 0 6px #38bdf8;
    }

    .noaa21 {
      background: #c084fc;

      box-shadow: 0 0 6px #c084fc;
    }

    .snpp {
      background: #4ade80;

      box-shadow: 0 0 6px #4ade80;
    }

    .orbit20 {
      color: #38bdf8;

      font-size: 16px;
    }

    .orbit21 {
      color: #c084fc;

      font-size: 16px;
    }

    .orbitSNPP {
      color: #4ade80;

      font-size: 16px;
    }

    /* =========================
       LEAFLET
       ========================= */

    .leaflet-control-layers {
      background: rgba(15,23,42,.95) !important;

      color: white;
    }

    /* =========================
       MÓVIL
       ========================= */

    @media(max-width:700px) {

      .header {
        height: 55px;
      }

      .subtitle {
        display: none;
      }

      .panel {
        top: 68px;

        left: 10px;

        width: calc(100% - 20px);

        max-height: 60vh;
      }

    }

  </style>

</head>


<body>


<!-- ======================================================
     ENCABEZADO
     ====================================================== -->

<div class="header">

  <div class="title">
    🔥 <span>FIRE MONITOR</span> PERÚ
  </div>

  <div class="subtitle">
    NASA FIRMS • VIIRS • NOAA
  </div>

</div>


<!-- ======================================================
     MAPA
     ====================================================== -->

<div id="map"></div>


<!-- ======================================================
     PANEL
     ====================================================== -->

<div class="panel">

  <h2>🇵🇪 Monitoreo de incendios</h2>


  <label class="input-label">
    NASA FIRMS MAP_KEY
  </label>

  <input
    id="mapKey"
    type="password"
    placeholder="Introduce tu MAP_KEY"
  >


  <button onclick="cargarIncendios()">
    🔥 CARGAR INCENDIOS
  </button>


  <button onclick="actualizarIncendios()">
    🔄 ACTUALIZAR
  </button>


  <div
    class="status"
    id="status"
  >
    Esperando MAP_KEY...
  </div>


  <!-- ==================================================
       ESTADÍSTICAS
       ================================================== -->

  <div class="stats">

    <div class="stat">

      <div
        class="stat-number"
        id="total"
      >
        0
      </div>

      <div class="stat-label">
        INCENDIOS
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="ultima"
      >
        --
      </div>

      <div class="stat-label">
        ÚLTIMA HORA
      </div>

    </div>

  </div>


  <!-- ==================================================
       CASILLAS DE INCENDIOS
       ================================================== -->

  <div class="layers">

    <div class="layers-title">
      🔥 INCENDIOS POR SATÉLITE
    </div>


    <label class="check">

      <input
        type="checkbox"
        id="showNOAA20"
        checked
        onchange="actualizarVisibilidad()"
      >

      <span class="dot noaa20"></span>

      🛰️ NOAA-20

    </label>


    <label class="check">

      <input
        type="checkbox"
        id="showNOAA21"
        checked
        onchange="actualizarVisibilidad()"
      >

      <span class="dot noaa21"></span>

      🛰️ NOAA-21

    </label>


    <label class="check">

      <input
        type="checkbox"
        id="showSNPP"
        checked
        onchange="actualizarVisibilidad()"
      >

      <span class="dot snpp"></span>

      🛰️ Suomi-NPP

    </label>


    <!-- ================================================
         ÓRBITAS
         ================================================ -->

    <div
      class="layers-title"
      style="margin-top:15px;"
    >
      🛰️ ÓRBITAS DE SATÉLITES
    </div>


    <label class="check">

      <input
        type="checkbox"
        id="showOrbit20"
        checked
        onchange="actualizarVisibilidad()"
      >

      <span class="orbit20">
        ━━
      </span>

      Órbita NOAA-20

    </label>


    <label class="check">

      <input
        type="checkbox"
        id="showOrbit21"
        checked
        onchange="actualizarVisibilidad()"
      >

      <span class="orbit21">
        ━━
      </span>

      Órbita NOAA-21

    </label>


    <label class="check">

      <input
        type="checkbox"
        id="showOrbitSNPP"
        checked
        onchange="actualizarVisibilidad()"
      >

      <span class="orbitSNPP">
        ━━
      </span>

      Órbita Suomi-NPP

    </label>

  </div>

</div>


<!-- ======================================================
     LEAFLET
     ====================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- ======================================================
     SATELLITE.JS
     ====================================================== -->

<script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>


<script>


// ==========================================================
// MAPA
// ==========================================================

const map = L.map("map").setView(
  [-9.19, -75.015],
  5
);


const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


L.control.scale().addTo(map);


// ==========================================================
// EXTENSIÓN DE PERÚ
// ==========================================================

const PERU = {

  west: -81.5,

  south: -18.5,

  east: -68.5,

  north: 0.5

};


// ==========================================================
// VARIABLES
// ==========================================================

let fireLayers = [];

let orbitLayers = [];

let currentKey = "";


// ==========================================================
// COLORES
// ==========================================================

const COLORS = {

  "NOAA-20": "#38bdf8",

  "NOAA-21": "#c084fc",

  "Suomi-NPP": "#4ade80"

};


// ==========================================================
// ICONO DE INCENDIO
// ==========================================================

function crearIcono(color) {

  return L.divIcon({

    className: "",

    html: `

      <div style="

        width:13px;

        height:13px;

        background:${color};

        border:2px solid white;

        border-radius:50%;

        box-shadow:0 0 8px ${color};

      "></div>

    `,

    iconSize: [13,13],

    iconAnchor: [6,6]

  });

}


// ==========================================================
// CSV
// ==========================================================

function csvToArray(text) {

  const lines =
    text.trim().split(/\r?\n/);


  if (lines.length < 2) {

    return [];

  }


  const headers =
    lines[0]
      .split(",")
      .map(x => x.trim());


  return lines
    .slice(1)
    .map(line => {

      const values =
        line.split(",");


      const obj = {};


      headers.forEach(
        (header, i) => {

          obj[header] =
            values[i] !== undefined
              ? values[i].trim()
              : "";

        }
      );


      return obj;

    });

}


// ==========================================================
// LIMPIAR INCENDIOS
// ==========================================================

function limpiarIncendios() {

  fireLayers.forEach(
    item => {

      if (
        item.marker &&
        map.hasLayer(item.marker)
      ) {

        map.removeLayer(
          item.marker
        );

      }

    }
  );


  fireLayers = [];

}


// ==========================================================
// CARGAR SATÉLITE
// ==========================================================

async function cargarSensor(
  sensor,
  nombre
) {

  const url =

    `https://firms.modaps.eosdis.nasa.gov/api/area/csv/` +

    `${currentKey}/` +

    `${sensor}/` +

    `${PERU.west},${PERU.south},${PERU.east},${PERU.north}/1`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `${nombre}: HTTP ${response.status}`
    );

  }


  const text =
    await response.text();


  return csvToArray(text);

}


// ==========================================================
// CARGAR INCENDIOS
// ==========================================================

async function cargarIncendios() {

  const key =
    document
      .getElementById("mapKey")
      .value
      .trim();


  if (!key) {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ Introduce tu MAP_KEY de NASA FIRMS.";

    return;

  }


  currentKey = key;


  localStorage.setItem(
    "firms_map_key",
    key
  );


  await actualizarIncendios();

}


// ==========================================================
// ACTUALIZAR INCENDIOS
// ==========================================================

async function actualizarIncendios() {

  if (!currentKey) {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ Primero introduce tu MAP_KEY.";

    return;

  }


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Consultando NASA FIRMS...";


  limpiarIncendios();


  try {

    const resultados =
      await Promise.all([

        cargarSensor(
          "VIIRS_NOAA20_NRT",
          "NOAA-20"
        ),

        cargarSensor(
          "VIIRS_NOAA21_NRT",
          "NOAA-21"
        ),

        cargarSensor(
          "VIIRS_SNPP_NRT",
          "Suomi-NPP"
        )

      ]);


    let total = 0;

    let fechas = [];


    resultados.forEach(
      (datos, indice) => {


        let nombreSat = "";


        if (indice === 0) {

          nombreSat =
            "NOAA-20";

        }


        if (indice === 1) {

          nombreSat =
            "NOAA-21";

        }


        if (indice === 2) {

          nombreSat =
            "Suomi-NPP";

        }


        const color =
          COLORS[nombreSat];


        datos.forEach(
          fire => {


            const lat =
              parseFloat(
                fire.latitude
              );


            const lon =
              parseFloat(
                fire.longitude
              );


            if (
              Number.isNaN(lat) ||
              Number.isNaN(lon)
            ) {

              return;

            }


            const marker =
              L.marker(
                [lat, lon],
                {
                  icon:
                    crearIcono(color)
                }
              );


            // =========================================
            // INFORMACIÓN DEL INCENDIO
            // =========================================

            const fecha =
              fire.acq_date || "--";


            const hora =
              fire.acq_time || "--";


            const frp =
              fire.frp || "--";


            const confidence =
              fire.confidence || "--";


            const daynight =
              fire.daynight || "--";


            marker.bindPopup(`

              <div style="
                color:#111;
                min-width:220px;
              ">

                <h3 style="
                  margin-top:0;
                  color:${color};
                ">
                  🔥 Incendio detectado
                </h3>


                <b>🛰️ Satélite:</b>

                ${nombreSat}

                <br><br>


                <b>📍 Latitud:</b>

                ${lat.toFixed(5)}

                <br>


                <b>📍 Longitud:</b>

                ${lon.toFixed(5)}

                <br><br>


                <b>📅 Fecha:</b>

                ${fecha}

                <br>


                <b>🕐 Hora UTC:</b>

                ${hora}

                <br><br>


                <b>🔥 FRP:</b>

                ${frp} MW

                <br>


                <b>🎯 Confianza:</b>

                ${confidence}

                <br>


                <b>☀️ Día/Noche:</b>

                ${daynight}

                <br><br>


                <small>
                  NASA FIRMS / VIIRS NRT
                </small>

              </div>

            `);


            // =========================================
            // AGREGAR AL MAPA
            // =========================================

            marker.addTo(map);


            // =========================================
            // GUARDAR CON SATÉLITE
            // =========================================

            fireLayers.push({

              marker: marker,

              satelite: nombreSat

            });


            total++;


            if (fecha) {

              fechas.push(
                `${fecha} ${hora}`
              );

            }

          }
        );

      }
    );


    // =====================================================
    // ESTADÍSTICAS
    // =====================================================

    document.getElementById(
      "total"
    ).textContent = total;


    if (fechas.length > 0) {

      fechas.sort();


      document.getElementById(
        "ultima"
      ).textContent =
        fechas[
          fechas.length - 1
        ].split(" ")[1] || "--";

    }


    const ahora =
      new Date()
        .toLocaleTimeString(
          "es-PE",
          {
            hour: "2-digit",

            minute: "2-digit"
          }
        );


    document.getElementById(
      "status"
    ).innerHTML =

      `✅ ${total} detecciones cargadas.<br>
       Actualizado: ${ahora}`;

    
    // Aplicar casillas
    actualizarVisibilidad();


  }

  catch (error) {

    console.error(error);


    document.getElementById(
      "status"
    ).innerHTML =

      `❌ Error consultando FIRMS.<br>
       ${error.message}`;

  }

}


// ==========================================================
// CONTROL DE VISIBILIDAD
// ==========================================================

function actualizarVisibilidad() {


  // ========================================================
  // INCENDIOS NOAA-20
  // ========================================================

  const mostrar20 =
    document.getElementById(
      "showNOAA20"
    ).checked;


  // ========================================================
  // INCENDIOS NOAA-21
  // ========================================================

  const mostrar21 =
    document.getElementById(
      "showNOAA21"
    ).checked;


  // ========================================================
  // INCENDIOS SUOMI
  // ========================================================

  const mostrarSNPP =
    document.getElementById(
      "showSNPP"
    ).checked;


  // ========================================================
  // MOSTRAR / OCULTAR INCENDIOS
  // ========================================================

  fireLayers.forEach(
    item => {

      let mostrar = true;


      if (
        item.satelite === "NOAA-20"
      ) {

        mostrar = mostrar20;

      }


      if (
        item.satelite === "NOAA-21"
      ) {

        mostrar = mostrar21;

      }


      if (
        item.satelite === "Suomi-NPP"
      ) {

        mostrar = mostrarSNPP;

      }


      if (mostrar) {

        if (
          !map.hasLayer(
            item.marker
          )
        ) {

          item.marker.addTo(map);

        }

      }

      else {

        if (
          map.hasLayer(
            item.marker
          )
        ) {

          map.removeLayer(
            item.marker
          );

        }

      }

    }
  );


  // ========================================================
  // ÓRBITAS
  // ========================================================

  const mostrarOrbit20 =
    document.getElementById(
      "showOrbit20"
    ).checked;


  const mostrarOrbit21 =
    document.getElementById(
      "showOrbit21"
    ).checked;


  const mostrarOrbitSNPP =
    document.getElementById(
      "showOrbitSNPP"
    ).checked;


  orbitLayers.forEach(
    item => {

      let mostrar = true;


      if (
        item.satelite === "NOAA-20"
      ) {

        mostrar =
          mostrarOrbit20;

      }


      if (
        item.satelite === "NOAA-21"
      ) {

        mostrar =
          mostrarOrbit21;

      }


      if (
        item.satelite === "Suomi-NPP"
      ) {

        mostrar =
          mostrarOrbitSNPP;

      }


      if (mostrar) {

        if (
          !map.hasLayer(
            item.layer
          )
        ) {

          item.layer.addTo(map);

        }

      }

      else {

        if (
          map.hasLayer(
            item.layer
          )
        ) {

          map.removeLayer(
            item.layer
          );

        }

      }

    }
  );

}


// ==========================================================
// SATÉLITES
// ==========================================================

const SATELLITES = [

  {
    name: "NOAA-20",

    search: "NOAA 20",

    color: "#38bdf8"
  },

  {
    name: "NOAA-21",

    search: "NOAA 21",

    color: "#c084fc"
  },

  {
    name: "Suomi-NPP",

    search: "SUOMI NPP",

    color: "#4ade80"
  }

];


// ==========================================================
// OBTENER TLE
// ==========================================================

async function obtenerTLE(nombre) {

  const url =
    "https://celestrak.org/NORAD/elements/gp.php" +

    "?NAME=" +

    encodeURIComponent(nombre) +

    "&FORMAT=TLE";


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "No se pudo obtener TLE"
    );

  }


  const text =
    await response.text();


  const lines =
    text.trim()
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);


  for (
    let i = 0;
    i < lines.length - 2;
    i++
  ) {

    if (

      lines[i + 1].startsWith("1 ") &&

      lines[i + 2].startsWith("2 ")

    ) {

      return {

        name: lines[i],

        line1: lines[i + 1],

        line2: lines[i + 2]

      };

    }

  }


  throw new Error(
    "TLE no encontrado"
  );

}


// ==========================================================
// POSICIÓN SATELITAL
// ==========================================================

function posicionSatelite(
  satrec,
  date
) {

  const positionAndVelocity =
    satellite.propagate(
      satrec,
      date
    );


  if (
    !positionAndVelocity.position
  ) {

    return null;

  }


  const gmst =
    satellite.gstime(date);


  const geodetic =
    satellite.eciToGeodetic(
      positionAndVelocity.position,

      gmst
    );


  const longitude =
    satellite.degreesLong(
      geodetic.longitude
    );


  const latitude =
    satellite.degreesLat(
      geodetic.latitude
    );


  return [

    latitude,

    longitude

  ];

}


// ==========================================================
// DIBUJAR ÓRBITA
// ==========================================================

async function dibujarOrbita(
  satInfo
) {

  try {

    const tle =
      await obtenerTLE(
        satInfo.search
      );


    const satrec =
      satellite.twoline2satrec(
        tle.line1,

        tle.line2
      );


    const puntos = [];


    const ahora =
      new Date();


    // ±50 minutos

    for (
      let minuto = -50;

      minuto <= 50;

      minuto += 1

    ) {

      const fecha =
        new Date(

          ahora.getTime() +

          minuto * 60000

        );


      const pos =
        posicionSatelite(
          satrec,

          fecha
        );


      if (pos) {

        puntos.push(pos);

      }

    }


    const linea =
      L.polyline(

        puntos,

        {

          color:
            satInfo.color,

          weight: 2,

          opacity: .85,

          dashArray: "7,5"

        }

      );


    linea.addTo(map);


    orbitLayers.push({

      layer: linea,

      satelite:
        satInfo.name

    });


    // ======================================================
    // POSICIÓN ACTUAL
    // ======================================================

    const actual =
      posicionSatelite(
        satrec,

        ahora
      );


    if (actual) {


      const marker =
        L.circleMarker(

          actual,

          {

            radius: 6,

            color: "white",

            weight: 2,

            fillColor:
              satInfo.color,

            fillOpacity: 1

          }

        );


      marker.addTo(map);


      marker.bindPopup(`

        <div style="
          color:#111;
        ">

          <b>🛰️ ${satInfo.name}</b>

          <br><br>

          Posición orbital estimada

          <br><br>

          Latitud:

          ${actual[0].toFixed(3)}°

          <br>

          Longitud:

          ${actual[1].toFixed(3)}°

        </div>

      `);


      orbitLayers.push({

        layer: marker,

        satelite:
          satInfo.name

      });

    }


  }

  catch (error) {

    console.warn(

      "Órbita no disponible:",

      satInfo.name,

      error

    );

  }

}


// ==========================================================
// CARGAR TODAS LAS ÓRBITAS
// ==========================================================

async function cargarOrbitas() {


  // eliminar anteriores

  orbitLayers.forEach(
    item => {

      if (
        map.hasLayer(
          item.layer
        )
      ) {

        map.removeLayer(
          item.layer
        );

      }

    }
  );


  orbitLayers = [];


  for (
    const sat of SATELLITES
  ) {

    await dibujarOrbita(
      sat
    );

  }


  // aplicar casillas

  actualizarVisibilidad();

}


// ==========================================================
// CARGAR ÓRBITAS INICIALES
// ==========================================================

cargarOrbitas();


// ==========================================================
// ACTUALIZACIÓN AUTOMÁTICA
// ==========================================================

setInterval(

  () => {


    if (currentKey) {

      actualizarIncendios();

    }


    cargarOrbitas();


  },

  15 * 60 * 1000

);


// ==========================================================
// RECUPERAR MAP_KEY
// ==========================================================

const savedKey =
  localStorage.getItem(
    "firms_map_key"
  );


if (savedKey) {

  document.getElementById(
    "mapKey"
  ).value =
    savedKey;

}

</script>
